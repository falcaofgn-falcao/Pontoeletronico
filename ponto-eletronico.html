/* ============================================================
   SELFIE CAMERA — Captura de foto para validar identidade
   ============================================================ */
function SelfieCamera({ onCapture, onCancel, selfieConfig }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const [error, setError] = useState('');
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let mounted = true;
    const startCamera = async () => {
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        if (!mounted) {
          s.getTracks().forEach(t => t.stop());
          return;
        }
        streamRef.current = s;
        if (videoRef.current) {
          videoRef.current.srcObject = s;
          videoRef.current.onloadedmetadata = () => setReady(true);
        }
      } catch (e) {
        setError('Não foi possível acessar a câmera. Verifique as permissões.');
      }
    };
    startCamera();
    return () => {
      mounted = false;
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  const handleCapture = () => {
    if (!videoRef.current || !canvasRef.current) return;
    const video = videoRef.current;
    const canvas = canvasRef.current;
    const maxWidth = selfieConfig?.maxWidth || 480;
    const ratio = video.videoHeight / video.videoWidth;
    canvas.width = maxWidth;
    canvas.height = Math.round(maxWidth * ratio);
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const quality = selfieConfig?.quality || 0.5;
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    onCapture(dataUrl);
  };

  const handleCancel = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    onCancel();
  };

  return (
    <div className="modal-backdrop" onClick={handleCancel}>
      <div className="selfie-modal" onClick={(e) => e.stopPropagation()}>
        <h3 className="modal__title" style={{margin: '0 0 0.75rem'}}>Tire uma selfie</h3>
        <p className="modal__msg" style={{marginBottom: '1rem', fontSize: '0.875rem'}}>
          Centralize o rosto no quadro e clique em "Capturar".
        </p>

        {error ? (
          <div className="field__error" style={{padding: '1rem', textAlign: 'center'}}>
            {error}
            <div style={{marginTop: '1rem'}}>
              <button className="btn-secondary" onClick={handleCancel}>Cancelar</button>
            </div>
          </div>
        ) : (
          <>
            <video ref={videoRef} className="selfie-video" autoPlay playsInline muted />
            <canvas ref={canvasRef} className="selfie-canvas" />
            <div className="selfie-actions">
              <button className="btn-secondary" onClick={handleCancel}>Cancelar</button>
              <button className="btn-primary" onClick={handleCapture} disabled={!ready} style={{width:'auto'}}>
                {ready ? '📸 Capturar' : 'Iniciando...'}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   EMPLOYEE SCREEN
   ============================================================ */
function EmployeeScreen({ data, currentUser, onAddRecord, onAddAdjustmentRequest, onShowToast }) {
  const [capturingLocation, setCapturingLocation] = useState(false);
  const [lastAddedId, setLastAddedId] = useState(null);
  const [view, setView] = useState('punch'); // 'punch' | 'mirror'
  const [showRequestModal, setShowRequestModal] = useState(false);
  const [pendingRecord, setPendingRecord] = useState(null); // registro aguardando selfie
  const [lastReceiptRecord, setLastReceiptRecord] = useState(null); // para o comprovante PDF

  const todayRecords = useMemo(() => {
    const today = todayKey();
    return data.records.filter(r => r.employeeId === currentUser.id && r.dateKey === today);
  }, [data.records, currentUser.id]);

  const monthRecords = useMemo(() => {
    const now = new Date();
    const ym = monthKey(now.getFullYear(), now.getMonth());
    return data.records.filter(r => r.employeeId === currentUser.id && r.dateKey.startsWith(ym));
  }, [data.records, currentUser.id]);

  const status = useMemo(() => getCurrentStatus(todayRecords), [todayRecords]);

  const dayWork = useMemo(() => calculateDayWork(todayRecords), [todayRecords]);
  const monthMs = useMemo(() => {
    const byDay = {};
    for (const r of monthRecords) {
      if (!byDay[r.dateKey]) byDay[r.dateKey] = [];
      byDay[r.dateKey].push(r);
    }
    let total = 0;
    for (const k in byDay) total += calculateDayWork(byDay[k]).totalMs;
    return total;
  }, [monthRecords]);

  // Função que efetivamente salva o registro
  const commitRecord = (record) => {
    onAddRecord(record);
    setLastAddedId(record.id);
    setLastReceiptRecord(record);
    setTimeout(() => setLastAddedId(null), 1500);

    const action = RECORD_TYPES[record.type].label;
    if (record.justification) {
      onShowToast('info', `⚠ ${action} registrada FORA do local. Justificativa enviada ao gestor.`);
    } else if (record.withinFence === false && record.distance != null) {
      onShowToast('error', `⚠ ${action} registrada FORA do local (${record.distance}m da farmácia)`);
    } else if (record.distance != null) {
      onShowToast('success', `${action} registrada às ${record.timeStr} · ${record.distance}m da farmácia`);
    } else {
      onShowToast('success', `${action} registrada às ${record.timeStr}`);
    }
  };

  // Quando selfie é capturada, anexa ao pendingRecord e salva
  const handleSelfieCaptured = (selfieDataUrl) => {
    if (!pendingRecord) return;
    const finalRecord = { ...pendingRecord, selfie: selfieDataUrl };
    setPendingRecord(null);
    commitRecord(finalRecord);
  };
  const handleSelfieCanceled = () => {
    onShowToast('error', 'Ponto cancelado — selfie é obrigatória');
    setPendingRecord(null);
  };

  const handleRegister = async (type) => {
    // Validações de sequência
    if (type === 'entrada' && status !== 'fora') {
      onShowToast('error', 'Você já está trabalhando hoje.');
      return;
    }
    if (type === 'inicio_intervalo' && status !== 'trabalhando') {
      onShowToast('error', 'Você precisa estar trabalhando para sair para o intervalo.');
      return;
    }
    if (type === 'fim_intervalo' && status !== 'em_intervalo') {
      onShowToast('error', 'Você precisa ter saído para o intervalo primeiro.');
      return;
    }
    if (type === 'saida' && status === 'fora') {
      onShowToast('error', 'Sem entrada registrada. Bata a entrada primeiro.');
      return;
    }
    if (type === 'saida' && status === 'em_intervalo') {
      onShowToast('error', 'Você está no intervalo. Volte do intervalo antes de sair.');
      return;
    }

    setCapturingLocation(true);
    const location = await getLocation();
    setCapturingLocation(false);

    // Geofence
    const gf = data.settings.geofence;
    let distance = null;
    let withinFence = true;
    let justification = null;

    if (gf && gf.enabled && gf.lat != null && gf.lng != null && location) {
      distance = haversineDistance(location.lat, location.lng, gf.lat, gf.lng);
      withinFence = distance != null && distance <= gf.radiusMeters;

      if (!withinFence && gf.mode === 'block') {
        if (gf.allowJustification) {
          justification = prompt(
            `Você está a ${distance}m da farmácia (limite: ${gf.radiusMeters}m).\n\n` +
            `Para registrar o ponto, informe a justificativa (será enviada para aprovação do gestor):`
          );
          if (!justification || !justification.trim()) {
            onShowToast('error', 'Ponto NÃO registrado — justificativa é obrigatória');
            return;
          }
          justification = justification.trim();
        } else {
          onShowToast('error', `Você está a ${distance}m da farmácia (limite: ${gf.radiusMeters}m). Ponto NÃO registrado.`);
          return;
        }
      }
    }
    if (gf && gf.enabled && gf.mode === 'block' && !location && !gf.allowJustification) {
      onShowToast('error', 'Não foi possível obter localização. Ative o GPS e tente novamente.');
      return;
    }

    const now = new Date();
    const newRecord = {
      id: uuid(),
      employeeId: currentUser.id,
      employeeName: currentUser.name,
      type,
      timestamp: now.getTime(),
      dateKey: todayKey(now),
      dateStr: formatDate(now),
      timeStr: formatTime(now),
      location,
      distance,
      withinFence,
      justification,
      needsApproval: !!justification,
      approved: justification ? null : true,
    };

    // Se selfie está ativada, abre câmera; senão salva direto
    const selfieConfig = data.settings.selfie;
    if (selfieConfig && selfieConfig.enabled) {
      setPendingRecord(newRecord);
    } else {
      commitRecord(newRecord);
    }
  };

  const stats = [
    { label: 'Status', value: status === 'trabalhando' ? 'Trabalhando' : status === 'em_intervalo' ? 'No Almoço' : 'Fora' },
    { label: 'Horas Hoje', value: formatDuration(dayWork.totalMs) },
    { label: 'Intervalo Hoje', value: dayWork.intervalMs > 0 ? formatDuration(dayWork.intervalMs) : '—' },
    { label: 'Horas no Mês', value: formatDuration(monthMs) },
  ];

  return (
    <div>
      <div className="tabs">
        <button className={`tab ${view === 'punch' ? 'is-active' : ''}`} onClick={() => setView('punch')}>Bater Ponto</button>
        <button className={`tab ${view === 'mirror' ? 'is-active' : ''}`} onClick={() => setView('mirror')}>Meu Espelho</button>
      </div>

      {view === 'mirror' ? (
        <EmployeeMirror data={data} currentUser={currentUser} onShowToast={onShowToast} />
      ) : (<>
      <div className="clock-row">
        <div className="greeting">
          <div className="greeting__hello">Bem-vindo</div>
          <h2 className="greeting__name">{currentUser.name}</h2>
        </div>
        <LiveClock />
      </div>

      {status === 'trabalhando' && (
        <div className="status-banner status-banner--in">
          <span className="status-banner__dot"></span>
          <span>Você está <strong>trabalhando</strong>. Quando for almoçar, bata "Saída p/ Almoço".</span>
        </div>
      )}
      {status === 'em_intervalo' && (
        <div className="status-banner" style={{backgroundColor:'var(--amber-tint)', border:'1px solid rgba(184, 137, 58, 0.3)', color:'#8A6A2C'}}>
          <span className="status-banner__dot"></span>
          <span>Você está em <strong>intervalo de almoço</strong>. Bata "Volta do Almoço" quando retornar.</span>
        </div>
      )}

      <section className="card panel">
        <div className="actions">
          {status === 'fora' && (
            <button onClick={() => handleRegister('entrada')}
              disabled={capturingLocation}
              className="big-btn big-btn--entrada"
              style={{gridColumn: '1 / -1'}}>
              <div className="big-btn__label">Registrar</div>
              <div className="big-btn__main">
                <span className="big-btn__title">Entrada</span>
                <svg className="big-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <path d="M7 17L17 7M17 7H8M17 7V16" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </button>
          )}
          {status === 'trabalhando' && (
            <>
              <button onClick={() => handleRegister('inicio_intervalo')}
                disabled={capturingLocation}
                className="big-btn big-btn--intervalo">
                <div className="big-btn__label">Sair para</div>
                <div className="big-btn__main">
                  <span className="big-btn__title">Almoço</span>
                  <svg className="big-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                    <path d="M12 2v6M9 8h6M5 14h14v8H5z M5 18h14" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
              </button>
              <button onClick={() => handleRegister('saida')}
                disabled={capturingLocation}
                className="big-btn big-btn--saida">
                <div className="big-btn__label">Registrar</div>
                <div className="big-btn__main">
                  <span className="big-btn__title">Saída</span>
                  <svg className="big-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                    <path d="M7 7L17 17M17 17V8M17 17H8" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
              </button>
            </>
          )}
          {status === 'em_intervalo' && (
            <button onClick={() => handleRegister('fim_intervalo')}
              disabled={capturingLocation}
              className="big-btn big-btn--intervalo"
              style={{gridColumn: '1 / -1'}}>
              <div className="big-btn__label">Voltar do</div>
              <div className="big-btn__main">
                <span className="big-btn__title">Almoço</span>
                <svg className="big-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <path d="M7 17L17 7M17 7H8M17 7V16" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </button>
          )}
        </div>
        {capturingLocation && (
          <div className="capturing">
            <svg className="capturing__spinner" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" opacity="0.25"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
            </svg>
            Capturando localização...
          </div>
        )}
      </section>

      <div className="stats">
        {stats.map((s, i) => (
          <div key={i} className="stats__cell">
            <div className="stats__label">{s.label}</div>
            <div className="stats__value">{s.value}</div>
          </div>
        ))}
      </div>

      <section className="card history">
        <div className="history__head">
          <div>
            <h2 className="history__title">Seus registros <span className="history__title-accent">— hoje</span></h2>
            <p className="history__meta">{todayRecords.length} registros</p>
          </div>
          <div className="history__controls">
            <button className="btn-ghost" onClick={() => setShowRequestModal(true)}>
              <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}>✎ Solicitar ajuste</span>
            </button>
          </div>
        </div>
        {todayRecords.length === 0 ? (
          <div className="empty">
            <div className="empty__title">Nenhum ponto registrado hoje</div>
            <p className="empty__hint">Use os botões acima para começar</p>
          </div>
        ) : (
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr><th>Tipo</th><th>Hora</th><th>Distância</th><th>Localização</th></tr>
              </thead>
              <tbody>
                {[...todayRecords].sort((a,b) => b.timestamp - a.timestamp).map(r => {
                  const ti = RECORD_TYPES[r.type] || { label: r.type };
                  const pillClass = r.type === 'inicio_intervalo' || r.type === 'fim_intervalo' ? 'pill--intervalo'
                                  : r.type === 'entrada' ? 'pill--entrada' : 'pill--saida';
                  return (
                    <tr key={r.id} className={r.id === lastAddedId ? 'is-flash' : ''}>
                      <td><span className={`pill ${pillClass}`}><span className="pill__dot"></span>{ti.label}</span></td>
                      <td className="cell-time">{r.timeStr}</td>
                      <td className="cell-mono" style={{fontSize:'0.8125rem', color: r.withinFence === false ? 'var(--brand)' : 'var(--muted)'}}>
                        {r.distance != null ? (<>{r.distance}m {r.withinFence === false && '⚠'}</>) : <span style={{color:'var(--muted-softer)'}}>—</span>}
                      </td>
                      <td className="cell-location">
                        {r.location ? (
                          <a href={`https://www.google.com/maps?q=${r.location.lat},${r.location.lng}`}
                            target="_blank" rel="noopener noreferrer"
                            title={`Precisão: ±${r.location.accuracy}m`}>
                            {r.location.lat.toFixed(4)}, {r.location.lng.toFixed(4)}
                          </a>
                        ) : <span className="cell-location__empty">—</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </section>
      </>)}

      {showRequestModal && (
        <RequestAdjustmentModal
          currentUser={currentUser}
          onSubmit={(req) => {
            onAddAdjustmentRequest(req);
            setShowRequestModal(false);
            onShowToast('success', 'Solicitação enviada ao gestor');
          }}
          onCancel={() => setShowRequestModal(false)}
        />
      )}

      {pendingRecord && (
        <SelfieCamera
          selfieConfig={data.settings.selfie}
          onCapture={handleSelfieCaptured}
          onCancel={handleSelfieCanceled}
        />
      )}

      {lastReceiptRecord && (
        <ReceiptModal
          record={lastReceiptRecord}
          settings={data.settings}
          onClose={() => setLastReceiptRecord(null)}
        />
      )}
    </div>
  );
}

/* ============================================================
   EMPLOYEE MIRROR — Espelho de ponto do colaborador
   ============================================================ */
function EmployeeMirror({ data, currentUser, onShowToast }) {
  const now = new Date();
  const [selectedYear, setSelectedYear] = useState(now.getFullYear());
  const [selectedMonth, setSelectedMonth] = useState(now.getMonth());

  const availableYears = useMemo(() => {
    const years = new Set([now.getFullYear()]);
    data.records.forEach(r => {
      if (r.employeeId === currentUser.id) years.add(new Date(r.timestamp).getFullYear());
    });
    return [...years].sort((a, b) => b - a);
  }, [data.records, currentUser.id]);

  const report = useMemo(() => {
    return calculateCLTReport(data.records, currentUser.id, selectedYear, selectedMonth, data.settings.clt, data.settings.holidays || []);
  }, [data.records, data.settings.clt, data.settings.holidays, currentUser.id, selectedYear, selectedMonth]);

  const employee = data.employees.find(e => e.id === currentUser.id);

  const handleDownloadPDF = () => {
    if (!employee || !report) return;
    try {
      generateEmployeePDF(employee, report, selectedYear, selectedMonth, data.settings);
      onShowToast('success', 'Seu espelho foi baixado');
    } catch (e) {
      onShowToast('error', 'Erro ao gerar PDF: ' + e.message);
    }
  };

  return (
    <div>
      <div className="clock-row">
        <div>
          <div className="greeting__hello">Seu espelho</div>
          <h2 className="greeting__name">Meus pontos</h2>
        </div>
      </div>

      <section className="card panel" style={{marginBottom:'1.5rem'}}>
        <div className="form-row" style={{marginBottom:0}}>
          <div>
            <label className="field__label">Mês</label>
            <select className="field__select" value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))}>
              {MESES_NOMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
            </select>
          </div>
          <div>
            <label className="field__label">Ano</label>
            <select className="field__select" value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))}>
              {availableYears.map(y => (<option key={y} value={y}>{y}</option>))}
            </select>
          </div>
          <button className="btn-primary" onClick={handleDownloadPDF} disabled={!report || report.days.length === 0} style={{width:'auto', padding: '0.875rem 1.5rem'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:'0.5rem'}}><Icon.PDF /> Baixar meu PDF</span>
          </button>
        </div>
      </section>

      {report.days.length === 0 ? (
        <div className="card panel">
          <div className="empty">
            <div className="empty__title">Sem registros nesse mês</div>
            <p className="empty__hint">Selecione outro período</p>
          </div>
        </div>
      ) : (
        <>
          <div className="report-summary">
            <div className="report-summary__cell">
              <div className="report-summary__label">Dias Trabalhados</div>
              <div className="report-summary__value">{report.daysWorked}</div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Total de Horas</div>
              <div className="report-summary__value">{formatDuration(report.totalMs)}</div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Horas Extras</div>
              <div className={`report-summary__value ${report.totalOvertime > 0 ? 'report-summary__value--ok' : ''}`}>
                {formatDuration(report.totalOvertime)}
              </div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Saldo vs {report.cltConfig.monthlyHours}h</div>
              <div className={`report-summary__value ${report.balanceMs >= 0 ? 'report-summary__value--ok' : 'report-summary__value--neg'}`}>
                {formatSignedDuration(report.balanceMs)}
              </div>
            </div>
          </div>

          {(report.nightMs > 0 || report.holidayMs > 0 || report.sundayMs > 0) && (
            <div className="report-summary" style={{marginTop:'1rem'}}>
              <div className="report-summary__cell">
                <div className="report-summary__label">Horas Noturnas (22h-5h)</div>
                <div className="report-summary__value">{formatDuration(report.nightMs)}</div>
              </div>
              <div className="report-summary__cell">
                <div className="report-summary__label">Adicional Noturno (20%)</div>
                <div className="report-summary__value">{formatDuration(report.nightAdditionalMs)}</div>
              </div>
              <div className="report-summary__cell">
                <div className="report-summary__label">Trabalho em Feriado</div>
                <div className="report-summary__value">{formatDuration(report.holidayMs)}</div>
              </div>
              <div className="report-summary__cell">
                <div className="report-summary__label">Trabalho em Domingo</div>
                <div className="report-summary__value">{formatDuration(report.sundayMs)}</div>
              </div>
            </div>
          )}

          <section className="card history" style={{marginTop:'1.5rem'}}>
            <div className="history__head">
              <div>
                <h3 className="history__title">Detalhamento <span className="history__title-accent">por dia</span></h3>
                <p className="history__meta">{MESES_NOMES[selectedMonth]} de {selectedYear}</p>
              </div>
            </div>
            <div className="table-wrap">
              <table className="table">
                <thead><tr><th>Data</th><th>Registros</th><th>Horas</th></tr></thead>
                <tbody>
                  {report.days.map(day => {
                    const [y, m, d] = day.dateKey.split('-').map(Number);
                    const dt = new Date(y, m - 1, d);
                    return (
                      <tr key={day.dateKey} style={day.isHoliday ? {backgroundColor: 'var(--brand-tint)'} : {}}>
                        <td>
                          <div className="cell-mono">{formatDate(dt)}</div>
                          <div style={{fontSize:'0.75rem',color: day.isHoliday ? 'var(--brand)' : 'var(--muted)',marginTop:'0.125rem'}}>
                            {DIAS_CURTOS[dt.getDay()]} {day.isHoliday && '· FERIADO'}
                          </div>
                        </td>
                        <td>
                          <div style={{display:'flex',flexDirection:'column',gap:'0.25rem'}}>
                            {day.pairs.map((p, i) => (
                              <div key={i} className="cell-mono" style={{fontSize:'0.8125rem'}}>
                                <span style={{color: p.entrada.type === 'fim_intervalo' ? 'var(--amber)' : 'var(--brand)'}}>{p.entrada.timeStr}</span>{' → '}
                                <span style={{color: p.saida.type === 'inicio_intervalo' ? 'var(--amber)' : 'var(--dark)'}}>{p.saida.timeStr}</span>
                                <span style={{color:'var(--muted)',marginLeft:'0.5rem'}}>({formatDurationHHMM(p.ms)})</span>
                              </div>
                            ))}
                          </div>
                        </td>
                        <td className="cell-time">{formatDurationHHMM(day.totalMs)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          {/* Banco de horas acumulado */}
          <BankBalanceSection
            data={data}
            employeeId={currentUser.id}
            year={selectedYear}
            month={selectedMonth}
          />
        </>
      )}

      <div className="help-box" style={{marginTop:'1.5rem'}}>
        <strong>Direito do trabalhador (Portaria 671/2021):</strong> você tem direito de acessar todos os seus registros de ponto e de receber uma cópia do espelho mensal. Em caso de divergência, fale com o administrador para fazer o ajuste.
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN — Colaboradores
   ============================================================ */
function AdminEmployees({ data, onUpdateData, onShowToast, onConfirm }) {
  const [name, setName] = useState('');
  const [password, setPassword] = useState('');
  const [sector, setSector] = useState(data.settings.sectors[0] || 'Balcão');
  const [scheduleType, setScheduleType] = useState('fixed');
  const [schedEntrada, setSchedEntrada] = useState(data.settings.defaultSchedule?.entrada || '07:00');
  const [schedSaidaAlmoco, setSchedSaidaAlmoco] = useState(data.settings.defaultSchedule?.saidaAlmoco || '12:00');
  const [schedVoltaAlmoco, setSchedVoltaAlmoco] = useState(data.settings.defaultSchedule?.voltaAlmoco || '13:00');
  const [schedSaida, setSchedSaida] = useState(data.settings.defaultSchedule?.saida || '17:00');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);
  const passwordMinLength = data.settings.passwordMinLength || 6;

  const handleAdd = async (e) => {
    e?.preventDefault?.();
    setError('');
    const trimmed = name.trim();
    if (!trimmed) return setError('Informe o nome');
    if (password.length < passwordMinLength) return setError(`Senha mínima de ${passwordMinLength} caracteres`);
    const exists = data.employees.some(em => em.name.toLowerCase() === trimmed.toLowerCase() && em.active);
    if (exists) return setError('Já existe um colaborador ativo com esse nome');
    setBusy(true);
    const passwordHash = await sha256(password);
    const newEmp = {
      id: uuid(),
      name: trimmed,
      passwordHash,
      active: true,
      createdAt: Date.now(),
      sector,
      workSchedule: {
        type: scheduleType,
        entrada: scheduleType === 'fixed' ? schedEntrada : null,
        saidaAlmoco: scheduleType === 'fixed' ? schedSaidaAlmoco : null,
        voltaAlmoco: scheduleType === 'fixed' ? schedVoltaAlmoco : null,
        saida: scheduleType === 'fixed' ? schedSaida : null,
      },
    };
    onUpdateData({ employees: [...data.employees, newEmp] });
    onShowToast('success', `${trimmed} cadastrado`);
    setName(''); setPassword(''); setBusy(false);
  };

  const handleResetPassword = async (emp) => {
    const newPass = prompt(`Nova senha para ${emp.name} (mínimo ${passwordMinLength} caracteres):`);
    if (!newPass) return;
    if (newPass.length < passwordMinLength) { onShowToast('error', `Mínimo ${passwordMinLength} caracteres`); return; }
    const passwordHash = await sha256(newPass);
    onUpdateData({ employees: data.employees.map(e => e.id === emp.id ? { ...e, passwordHash } : e) });
    onShowToast('success', 'Senha redefinida');
  };

  const handleToggle = (emp) => {
    onConfirm(
      `${emp.active ? 'Desativar' : 'Reativar'} colaborador`,
      `Tem certeza que deseja ${emp.active ? 'desativar' : 'reativar'} ${emp.name}? ${emp.active ? 'O histórico é preservado.' : ''}`,
      () => {
        onUpdateData({ employees: data.employees.map(e => e.id === emp.id ? { ...e, active: !e.active } : e) });
        onShowToast('info', `Colaborador ${emp.active ? 'desativado' : 'reativado'}`);
      }
    );
  };

  const handleEditSector = (emp) => {
    const newSector = prompt(
      `Setor atual de ${emp.name}: ${emp.sector || 'não definido'}\n\nDigite o novo setor (ou deixe em branco para cancelar):\n\nSetores disponíveis: ${data.settings.sectors.join(', ')}`,
      emp.sector || ''
    );
    if (newSector === null || newSector.trim() === '') return;
    onUpdateData({ employees: data.employees.map(e => e.id === emp.id ? { ...e, sector: newSector.trim() } : e) });
    onShowToast('success', `Setor de ${emp.name} atualizado`);
  };

  const sorted = [...data.employees].sort((a, b) => {
    if (a.active !== b.active) return a.active ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  return (
    <div>
      <h2 className="panel-title">Colaboradores</h2>
      <p className="panel-sub">Cadastre, redefina senhas e gerencie acesso.</p>

      <section className="card panel" style={{marginBottom: '2rem'}}>
        <form onSubmit={handleAdd}>
          <div className="form-row">
            <div>
              <label className="field__label">Nome completo</label>
              <input className="field__input" type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Nome do colaborador" />
            </div>
            <div>
              <label className="field__label">Senha (mín. {passwordMinLength})</label>
              <input className="field__input" type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder={`Mínimo ${passwordMinLength} caracteres`} />
            </div>
            <div>
              <label className="field__label">Setor</label>
              <select className="field__select" value={sector} onChange={(e) => setSector(e.target.value)}>
                {data.settings.sectors.map(s => (<option key={s} value={s}>{s}</option>))}
              </select>
            </div>
          </div>

          <div className="form-row" style={{marginBottom: '1rem'}}>
            <div>
              <label className="field__label">Tipo de jornada</label>
              <select className="field__select" value={scheduleType} onChange={(e) => setScheduleType(e.target.value)}>
                <option value="fixed">Horário fixo (controla atrasos)</option>
                <option value="flexible">Horário flexível (sem controle de atraso)</option>
              </select>
            </div>
            <div></div>
            <div></div>
          </div>

          {scheduleType === 'fixed' && (
            <div className="form-row" style={{marginBottom: '1rem'}}>
              <div>
                <label className="field__label">Entrada</label>
                <input className="field__input" type="time" value={schedEntrada} onChange={(e) => setSchedEntrada(e.target.value)} />
              </div>
              <div>
                <label className="field__label">Saída Almoço</label>
                <input className="field__input" type="time" value={schedSaidaAlmoco} onChange={(e) => setSchedSaidaAlmoco(e.target.value)} />
              </div>
              <div>
                <label className="field__label">Volta Almoço</label>
                <input className="field__input" type="time" value={schedVoltaAlmoco} onChange={(e) => setSchedVoltaAlmoco(e.target.value)} />
              </div>
            </div>
          )}

          {scheduleType === 'fixed' && (
            <div className="form-row" style={{marginBottom: '1rem'}}>
              <div>
                <label className="field__label">Saída</label>
                <input className="field__input" type="time" value={schedSaida} onChange={(e) => setSchedSaida(e.target.value)} />
              </div>
              <div></div>
              <div></div>
            </div>
          )}

          <div style={{display:'flex',justifyContent:'flex-end'}}>
            <button type="submit" className="btn-primary" disabled={busy} style={{width: 'auto', padding: '0.875rem 1.5rem'}}>
              <span style={{display: 'inline-flex', alignItems: 'center', gap: '0.5rem'}}><Icon.Plus /> Cadastrar colaborador</span>
            </button>
          </div>
          {error && <div className="field__error">{error}</div>}
        </form>
      </section>

      <section className="card history" style={{marginTop: 0}}>
        <div className="history__head">
          <div>
            <h2 className="history__title">Lista</h2>
            <p className="history__meta">{data.employees.length} cadastrados · {data.employees.filter(e => e.active).length} ativos</p>
          </div>
        </div>
        {sorted.length === 0 ? (
          <div className="empty">
            <div className="empty__title">Nenhum colaborador ainda</div>
            <p className="empty__hint">Use o formulário acima</p>
          </div>
        ) : (
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr><th>Nome</th><th>Setor</th><th>Jornada</th><th>Status</th><th style={{textAlign:'right'}}>Ações</th></tr>
              </thead>
              <tbody>
                {sorted.map(emp => (
                  <tr key={emp.id} style={{opacity: emp.active ? 1 : 0.55}}>
                    <td className="cell-name">{emp.name}</td>
                    <td><span style={{fontSize:'0.8125rem'}}>{emp.sector || '—'}</span></td>
                    <td style={{fontSize: '0.75rem', fontFamily: 'var(--font-mono)'}}>
                      {emp.workSchedule?.type === 'fixed' && emp.workSchedule.entrada ? (
                        <>{emp.workSchedule.entrada}–{emp.workSchedule.saida}</>
                      ) : (<span style={{color: 'var(--muted)'}}>Flexível</span>)}
                    </td>
                    <td><span className={`pill ${emp.active ? 'pill--entrada' : 'pill--saida'}`}><span className="pill__dot"></span>{emp.active ? 'ativo' : 'desativado'}</span></td>
                    <td style={{textAlign:'right'}}>
                      <div style={{display:'inline-flex',gap:'0.375rem',flexWrap:'wrap',justifyContent:'flex-end'}}>
                        <button className="btn-ghost" onClick={() => handleEditSector(emp)}>Setor</button>
                        <button className="btn-ghost" onClick={() => handleResetPassword(emp)}>Nova senha</button>
                        <button className={`btn-ghost ${emp.active ? 'btn-ghost--danger' : ''}`} onClick={() => handleToggle(emp)}>
                          {emp.active ? 'Desativar' : 'Reativar'}
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

/* ============================================================
   ADMIN — Seção de Banco de Horas Acumulado
   ============================================================ */
function BankBalanceSection({ data, employeeId, year, month }) {
  const bank = useMemo(() => {
    if (!employeeId) return null;
    return calculateBankBalance(data.records, employeeId, year, month, data.settings.clt, data.settings.holidays || []);
  }, [data.records, data.settings.clt, data.settings.holidays, employeeId, year, month]);

  if (!bank || bank.byMonth.length === 0) return null;

  return (
    <section className="card panel" style={{marginTop:'1.5rem'}}>
      <h3 style={{margin:'0 0 0.25rem',fontFamily:'var(--font-display)',fontSize:'1.25rem',fontWeight:500}}>
        Banco de Horas <span style={{fontStyle:'italic',fontWeight:300,color:'var(--brand)'}}>acumulado</span>
      </h3>
      <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.875rem'}}>
        Soma dos saldos mensais até {MESES_NOMES[month]}/{year}.
      </p>

      <div style={{
        padding: '1.25rem', borderRadius: 'var(--radius-md)',
        backgroundColor: bank.accumulatedMs >= 0 ? 'var(--brand-tint)' : 'var(--dark-tint)',
        border: `1px solid ${bank.accumulatedMs >= 0 ? 'var(--brand-tint-strong)' : 'var(--line)'}`,
        marginBottom: '1rem',
      }}>
        <div style={{fontFamily:'var(--font-mono)',fontSize:'0.625rem',textTransform:'uppercase',letterSpacing:'0.2em',color:'var(--muted)',marginBottom:'0.5rem'}}>
          Saldo acumulado total
        </div>
        <div style={{
          fontFamily:'var(--font-display)', fontSize:'2.5rem', fontWeight: 500,
          color: bank.accumulatedMs >= 0 ? 'var(--brand)' : 'var(--dark)',
        }}>
          {formatSignedDuration(bank.accumulatedMs)}
        </div>
        <div style={{fontSize:'0.8125rem',color:'var(--muted)',marginTop:'0.25rem'}}>
          {bank.accumulatedMs >= 0
            ? 'Horas a favor do colaborador (banco positivo)'
            : 'Horas a favor da empresa (banco negativo)'}
        </div>
      </div>

      <div className="table-wrap">
        <table className="table">
          <thead><tr><th>Mês</th><th>Horas trabalhadas</th><th>Horas extras</th><th>Saldo do mês</th></tr></thead>
          <tbody>
            {bank.byMonth.map(m => (
              <tr key={m.ym}>
                <td className="cell-name">{m.label}</td>
                <td className="cell-time">{formatDurationHHMM(m.totalMs)}</td>
                <td className="cell-time" style={{color: m.overtimeMs > 0 ? 'var(--brand)' : 'var(--muted)'}}>
                  {m.overtimeMs > 0 ? formatDurationHHMM(m.overtimeMs) : '—'}
                </td>
                <td className="cell-time" style={{
                  color: m.balanceMs >= 0 ? 'var(--brand)' : 'var(--dark)',
                  fontWeight: 600,
                }}>
                  {formatSignedDuration(m.balanceMs)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="help-box" style={{marginTop:'1rem', marginBottom:0, fontSize:'0.8125rem'}}>
        <strong>Como usar:</strong> banco positivo = colaborador tem horas para folgar ou receber como extras. Banco negativo = colaborador deve horas (faltas/atrasos a compensar).
        Conforme a CLT (Art. 59-A), <strong>compensação via banco de horas exige acordo individual ou coletivo escrito</strong>.
      </div>
    </section>
  );
}

function AdminReports({ data, onShowToast }) {
  const now = new Date();
  const [selectedEmployeeId, setSelectedEmployeeId] = useState(data.employees[0]?.id || '');
  const [selectedYear, setSelectedYear] = useState(now.getFullYear());
  const [selectedMonth, setSelectedMonth] = useState(now.getMonth());

  const selectedEmployee = data.employees.find(e => e.id === selectedEmployeeId);

  const availableYears = useMemo(() => {
    const years = new Set([now.getFullYear()]);
    data.records.forEach(r => years.add(new Date(r.timestamp).getFullYear()));
    return [...years].sort((a, b) => b - a);
  }, [data.records]);

  const report = useMemo(() => {
    if (!selectedEmployeeId) return null;
    return calculateCLTReport(data.records, selectedEmployeeId, selectedYear, selectedMonth, data.settings.clt, data.settings.holidays || []);
  }, [data.records, data.settings.clt, data.settings.holidays, selectedEmployeeId, selectedYear, selectedMonth]);

  const handleExportPDF = () => {
    if (!selectedEmployee || !report) return;
    try {
      generateEmployeePDF(selectedEmployee, report, selectedYear, selectedMonth, data.settings);
      onShowToast('success', 'PDF gerado');
    } catch (e) {
      console.error(e);
      onShowToast('error', 'Erro ao gerar PDF: ' + e.message);
    }
  };

  const handleExportCSV = () => {
    if (!selectedEmployee || !report) return;
    const cfg = report.cltConfig;
    const rows = ['Data,Dia,Entradas,Saidas,Horas,Detalhamento'];
    for (const day of report.days) {
      const [y, m, d] = day.dateKey.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const entradas = day.records.filter(r => r.type === 'entrada').map(r => r.timeStr).join(' | ');
      const saidas = day.records.filter(r => r.type === 'saida').map(r => r.timeStr).join(' | ');
      const detalhe = day.pairs.map(p => `${p.entrada.timeStr}-${p.saida.timeStr} (${formatDurationHHMM(p.ms)})`).join(' | ');
      rows.push([formatDate(dt), DIAS_CURTOS[dt.getDay()], entradas, saidas, formatDurationHHMM(day.totalMs), detalhe || '—'].map(csvCell).join(','));
    }
    rows.push('');
    rows.push(['RESUMO', '', '', '', '', ''].map(csvCell).join(','));
    rows.push(['Total trabalhado', formatDurationHHMM(report.totalMs)].map(csvCell).join(','));
    rows.push([`Carga prevista (${cfg.monthlyHours}h)`, formatDurationHHMM(report.expectedMonthlyMs)].map(csvCell).join(','));
    rows.push(['Horas extras (>' + cfg.weeklyHours + 'h/sem)', formatDurationHHMM(report.totalOvertime)].map(csvCell).join(','));
    rows.push(['Saldo', (report.balanceMs >= 0 ? '+' : '-') + formatDurationHHMM(Math.abs(report.balanceMs))].map(csvCell).join(','));

    const csv = '\ufeff' + rows.join('\n');
    const filename = `ponto_${selectedEmployee.name.replace(/\s+/g,'_')}_${selectedYear}-${pad(selectedMonth+1)}.csv`;
    downloadBlob(csv, filename, 'text/csv;charset=utf-8;');
    onShowToast('success', 'CSV exportado');
  };

  return (
    <div>
      <h2 className="panel-title">Relatórios <span className="panel-title__accent">CLT</span></h2>
      <p className="panel-sub">
        Baseado em <strong>{data.settings.clt.weeklyHours}h semanais</strong> e <strong>{data.settings.clt.monthlyHours}h mensais</strong> (configurável). Exporte em PDF para arquivar.
      </p>

      <section className="card panel" style={{marginBottom: '2rem'}}>
        <div className="form-row" style={{marginBottom: 0}}>
          <div>
            <label className="field__label">Colaborador</label>
            <select className="field__select" value={selectedEmployeeId} onChange={(e) => setSelectedEmployeeId(e.target.value)}>
              <option value="">Selecione...</option>
              {data.employees.map(emp => (<option key={emp.id} value={emp.id}>{emp.name} {!emp.active && '(desativado)'}</option>))}
            </select>
          </div>
          <div>
            <label className="field__label">Mês</label>
            <select className="field__select" value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))}>
              {MESES_NOMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
            </select>
          </div>
          <div>
            <label className="field__label">Ano</label>
            <select className="field__select" value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))}>
              {availableYears.map(y => (<option key={y} value={y}>{y}</option>))}
            </select>
          </div>
        </div>
      </section>

      {!selectedEmployee ? (
        <div className="card panel">
          <div className="empty">
            <div className="empty__title">Selecione um colaborador</div>
            <p className="empty__hint">Use o seletor acima</p>
          </div>
        </div>
      ) : (
        <>
          <div className="toolbar">
            <div>
              <h3 style={{margin:0,fontFamily:'var(--font-display)',fontSize:'1.25rem',fontWeight:500}}>{selectedEmployee.name}</h3>
              <p style={{margin:0,fontSize:'0.875rem',color:'var(--muted)'}}>{MESES_NOMES[selectedMonth]} de {selectedYear}</p>
            </div>
            <div className="toolbar__right">
              <button className="btn-ghost btn-ghost--accent" onClick={handleExportPDF} disabled={!report || report.days.length === 0}>
                <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.PDF /> Imprimir PDF</span>
              </button>
              <button className="btn-ghost" onClick={handleExportCSV} disabled={!report || report.days.length === 0}>
                <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Download /> CSV</span>
              </button>
            </div>
          </div>

          <div className="report-summary">
            <div className="report-summary__cell">
              <div className="report-summary__label">Dias Trabalhados</div>
              <div className="report-summary__value">{report.daysWorked}</div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Total de Horas</div>
              <div className="report-summary__value">{formatDuration(report.totalMs)}</div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Horas Extras</div>
              <div className={`report-summary__value ${report.totalOvertime > 0 ? 'report-summary__value--ok' : ''}`}>
                {formatDuration(report.totalOvertime)}
              </div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Saldo vs {report.cltConfig.monthlyHours}h</div>
              <div className={`report-summary__value ${report.balanceMs >= 0 ? 'report-summary__value--ok' : 'report-summary__value--neg'}`}>
                {formatSignedDuration(report.balanceMs)}
              </div>
            </div>
          </div>

          {/* Indicadores adicionais CLT */}
          <div className="report-summary" style={{marginTop:'1rem'}}>
            <div className="report-summary__cell">
              <div className="report-summary__label">Horas Noturnas (22h-5h)</div>
              <div className="report-summary__value">{formatDuration(report.nightMs)}</div>

            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Adicional Noturno (20%)</div>
              <div className={`report-summary__value ${report.nightAdditionalMs > 0 ? 'report-summary__value--ok' : ''}`}>
                {formatDuration(report.nightAdditionalMs)}
              </div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Trabalho em Feriado</div>
              <div className={`report-summary__value ${report.holidayMs > 0 ? 'report-summary__value--ok' : ''}`}>
                {formatDuration(report.holidayMs)}
              </div>
            </div>
            <div className="report-summary__cell">
              <div className="report-summary__label">Trabalho em Domingo</div>
              <div className={`report-summary__value ${report.sundayMs > 0 ? 'report-summary__value--ok' : ''}`}>
                {formatDuration(report.sundayMs)}
              </div>
            </div>
          </div>

          {/* Banco de horas acumulado */}
          <BankBalanceSection
            data={data}
            employeeId={selectedEmployeeId}
            year={selectedYear}
            month={selectedMonth}
          />

          {report.issues.length > 0 && (
            <section className="card panel" style={{marginTop:'1.5rem', borderColor:'var(--amber)', backgroundColor:'var(--amber-tint)'}}>
              <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500, color:'#8A6A2C'}}>
                ⚠ Alertas CLT detectados ({report.issues.length})
              </h3>
              <p style={{margin:'0 0 1rem', fontSize:'0.875rem', color:'#8A6A2C'}}>
                Pontos do mês que merecem atenção segundo a CLT. Revise antes do fechamento da folha.
              </p>
              <ul style={{margin:0, paddingLeft:'1.25rem', fontSize:'0.875rem', color:'var(--ink)'}}>
                {report.issues.slice(0, 20).map((iss, i) => {
                  const [y, m, d] = iss.dateKey.split('-').map(Number);
                  const dt = new Date(y, m-1, d);
                  return (
                    <li key={i} style={{marginBottom:'0.25rem'}}>
                      <strong>{formatDate(dt)} ({DIAS_CURTOS[dt.getDay()]}):</strong> {iss.label}
                    </li>
                  );
                })}
                {report.issues.length > 20 && (<li style={{color:'var(--muted)'}}>e mais {report.issues.length - 20} alertas...</li>)}
              </ul>

          {/* Análise semanal */}
          {report.weeks.length > 0 && (
            <section className="card history" style={{marginTop:'1.5rem'}}>
              <div className="history__head">
                <div>
                  <h3 className="history__title">Análise <span className="history__title-accent">semanal</span></h3>
                  <p className="history__meta">Limite CLT: {report.cltConfig.weeklyHours}h/semana</p>

                          <td>
                            <div style={{display:'flex',flexDirection:'column',gap:'0.25rem'}}>
                              {day.pairs.map((p, i) => {
                                const isLunch = p.entrada.type === 'fim_intervalo' || p.saida.type === 'inicio_intervalo';
                                return (
                                <div key={i} className="cell-mono" style={{fontSize:'0.8125rem'}}>

                                  <span style={{color: p.saida.type === 'inicio_intervalo' ? 'var(--amber)' : 'var(--dark)'}}>{p.saida.timeStr}</span>
                                  <span style={{color:'var(--muted)',marginLeft:'0.5rem'}}>({formatDurationHHMM(p.ms)})</span>
                                </div>
                              );})}
                              {day.breaks.map((b, i) => (
                                <div key={'b'+i} className="cell-mono" style={{fontSize:'0.75rem', color:'var(--amber)', fontStyle:'italic'}}>

                              {day.openEntry && (

                                <div style={{fontSize:'0.6875rem', color:'var(--brand)', marginTop:'0.25rem'}}>
                                  ⚠ {day.issues.map(i => i.label).join(', ')}
                                </div>
                              )}
                            </div>
                          </td>
                          <td className="cell-time">{formatDurationHHMM(day.totalMs)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </section>
        </>
      )}
    </div>
  );
}

/* ============================================================

   ============================================================ */
function HolidayManager({ data, onUpdateData, onShowToast }) {
  const [newDate, setNewDate] = useState('');
  const [newName, setNewName] = useState('');
  const holidays = data.settings.holidays || [];

  const sortedHolidays = useMemo(() => {
    return [...holidays].sort((a, b) => a.date.localeCompare(b.date));
  }, [holidays]);

  const handleAdd = () => {
    if (!newDate || !newName.trim()) {
      onShowToast('error', 'Informe data e nome do feriado');
      return;
    }
    if (holidays.some(h => h.date === newDate)) {
      onShowToast('error', 'Já existe feriado cadastrado nessa data');
      return;
    }
    onUpdateData({
      settings: { ...data.settings, holidays: [...holidays, { date: newDate, name: newName.trim() }] },
    });
    onShowToast('success', 'Feriado adicionado');
    setNewDate(''); setNewName('');
  };

  const handleDelete = (date) => {
    onUpdateData({
      settings: { ...data.settings, holidays: holidays.filter(h => h.date !== date) },
    });
    onShowToast('info', 'Feriado removido');
  };

  return (
    <div>
      <div className="form-row" style={{marginBottom:'1rem'}}>
        <div>
          <label className="field__label">Data</label>
          <input className="field__input" type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} />
        </div>
        <div>
          <label className="field__label">Nome do feriado</label>
          <input className="field__input" type="text" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Ex: Aniversário da cidade" />
        </div>
        <button className="btn-secondary" onClick={handleAdd}>
          <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Plus /> Adicionar</span>
        </button>
      </div>

      {sortedHolidays.length > 0 && (
        <div className="table-wrap" style={{maxHeight: '20rem', overflowY: 'auto'}}>
          <table className="table">
            <thead><tr><th>Data</th><th>Nome</th><th style={{textAlign:'right'}}></th></tr></thead>
            <tbody>
              {sortedHolidays.map(h => {
                const [y, m, d] = h.date.split('-').map(Number);
                const dt = new Date(y, m-1, d);
                return (
                  <tr key={h.date}>
                    <td className="cell-mono">{formatDate(dt)} <span style={{color:'var(--muted)',fontSize:'0.75rem'}}>({DIAS_CURTOS[dt.getDay()]})</span></td>
                    <td>{h.name}</td>
                    <td style={{textAlign:'right'}}>
                      <button className="btn-ghost btn-ghost--danger" onClick={() => handleDelete(h.date)}>
                        <Icon.Trash />
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function AdminSettings({ data, onUpdateData, onShowToast }) {
  const [companyName, setCompanyName] = useState(data.settings.companyName);
  const [weeklyHours, setWeeklyHours] = useState(data.settings.clt.weeklyHours);
  const [monthlyHours, setMonthlyHours] = useState(data.settings.clt.monthlyHours);
  // Geofence
  const gf = data.settings.geofence || { enabled: false, lat: null, lng: null, radiusMeters: 100, mode: 'alert' };
  const [gfEnabled, setGfEnabled] = useState(gf.enabled);
  const [gfLat, setGfLat] = useState(gf.lat != null ? String(gf.lat) : '');
  const [gfLng, setGfLng] = useState(gf.lng != null ? String(gf.lng) : '');
  const [gfRadius, setGfRadius] = useState(gf.radiusMeters);
  const [gfMode, setGfMode] = useState(gf.mode);
  const [gfCapturing, setGfCapturing] = useState(false);
  // Selfie
  const selfieCfg = data.settings.selfie || { enabled: false };
  const [selfieEnabled, setSelfieEnabled] = useState(selfieCfg.enabled);

  const [oldPass, setOldPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [newPass2, setNewPass2] = useState('');
  const [passError, setPassError] = useState('');
  const fileInputRef = useRef(null);

  const handleLogoUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 500 * 1024) { onShowToast('error', 'Logo muito grande (máx 500KB)'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      onUpdateData({ settings: { ...data.settings, logo: ev.target.result } });
      onShowToast('success', 'Logo atualizada');
    };
    reader.readAsDataURL(file);
  };
  const handleRemoveLogo = () => {
    onUpdateData({ settings: { ...data.settings, logo: null } });
    onShowToast('info', 'Logo removida');
  };
  const handleSaveName = () => {
    if (!companyName.trim()) { onShowToast('error', 'Nome não pode ser vazio'); return; }
    onUpdateData({ settings: { ...data.settings, companyName: companyName.trim() } });
    onShowToast('success', 'Nome atualizado');
  };
  const handleSaveCLT = () => {
    const w = Number(weeklyHours), m = Number(monthlyHours);
    if (!w || w < 1 || w > 60) { onShowToast('error', 'Horas semanais inválidas'); return; }
    if (!m || m < 1 || m > 300) { onShowToast('error', 'Horas mensais inválidas'); return; }
    onUpdateData({ settings: { ...data.settings, clt: { weeklyHours: w, monthlyHours: m } } });
    onShowToast('success', 'Configuração CLT atualizada');
  };
  const handleUseMyLocation = async () => {
    setGfCapturing(true);
    const loc = await getLocation();
    setGfCapturing(false);
    if (!loc) {
      onShowToast('error', 'Não foi possível obter localização. Ative o GPS e permita o acesso.');
      return;
    }
    setGfLat(loc.lat.toFixed(7));
    setGfLng(loc.lng.toFixed(7));
    onShowToast('success', `Localização capturada (precisão ±${loc.accuracy}m)`);
  };
  const handleSaveGeofence = () => {
    const lat = parseFloat(gfLat), lng = parseFloat(gfLng), r = parseInt(gfRadius);
    if (gfEnabled) {
      if (isNaN(lat) || lat < -90 || lat > 90) { onShowToast('error', 'Latitude inválida'); return; }
      if (isNaN(lng) || lng < -180 || lng > 180) { onShowToast('error', 'Longitude inválida'); return; }
      if (isNaN(r) || r < 10 || r > 5000) { onShowToast('error', 'Raio deve estar entre 10 e 5000 metros'); return; }
    }
    onUpdateData({
      settings: {
        ...data.settings,
        geofence: { enabled: gfEnabled, lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng, radiusMeters: r || 100, mode: gfMode },
      },
    });
    onShowToast('success', 'Cerca virtual atualizada');
  };
  const handleChangePassword = async (e) => {
    e?.preventDefault?.();
    setPassError('');
    const oldHash = await sha256(oldPass);
    if (oldHash !== data.admin.passwordHash) return setPassError('Senha atual incorreta');
    if (newPass.length < 6) return setPassError('Mínimo 6 caracteres');
    if (newPass !== newPass2) return setPassError('As senhas não coincidem');
    const newHash = await sha256(newPass);
    onUpdateData({ admin: { passwordHash: newHash } });
    onShowToast('success', 'Senha alterada');
    setOldPass(''); setNewPass(''); setNewPass2('');
  };

  return (
    <div>
      <h2 className="panel-title">Configurações</h2>
      <p className="panel-sub">Logo, nome, jornada CLT e senha de administrador.</p>

      <section className="card panel" style={{marginBottom:'2rem'}}>

            {data.settings.logo ? <img src={data.settings.logo} alt="" /> : 'L'}

          </div>
          <div className="logo-uploader__actions">
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleLogoUpload} className="file-input-hidden" />
            <button className="btn-ghost" onClick={() => fileInputRef.current?.click()}>
              <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Upload /> {data.settings.logo ? 'Trocar' : 'Enviar'}</span>
            </button>
            {data.settings.logo && (<button className="btn-ghost btn-ghost--danger" onClick={handleRemoveLogo}>Remover</button>)}
          </div>
        </div>
      </section>

      <section className="card panel" style={{marginBottom:'2rem'}}>
        <h3 style={{margin:'0 0 1rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>Nome da empresa</h3>
        <div className="form-row" style={{marginBottom:0}}>
          <div style={{gridColumn:'span 2'}}>
            <input className="field__input" type="text" value={companyName} onChange={(e) => setCompanyName(e.target.value)} />
          </div>
          <button className="btn-secondary" onClick={handleSaveName}>Salvar</button>
        </div>
      </section>

      <section className="card panel" style={{marginBottom:'2rem'}}>
        <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>Jornada CLT</h3>
        <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.9375rem'}}>
          Padrão CLT: 44h/semana e 220h/mês. Ajuste se sua empresa usa jornada diferente.

        <div className="form-row" style={{marginBottom:0}}>
          <div>

            <input className="field__input" type="number" min="1" max="60" value={weeklyHours} onChange={(e) => setWeeklyHours(e.target.value)} />
          </div>

      <section className="card panel" style={{marginBottom:'2rem'}}>

/* ============================================================
   ADMIN — Sincronização Firebase
   ============================================================ */
function AdminSync({ syncStatus, syncError, onConfigure, onDisconnect, onShowToast, onConfirm }) {
  const usingEmbedded = firebaseSync.isUsingEmbedded();
  const [configJson, setConfigJson] = useState(() => {
    const cfg = firebaseSync.getConfig();
    return cfg ? JSON.stringify(cfg, null, 2) : '';
  });
  const [busy, setBusy] = useState(false);

  const handleSave = async () => {
    setBusy(true);
    try {
      const parsed = JSON.parse(configJson);
      if (!parsed.apiKey || !parsed.projectId) {
        onShowToast('error', 'Configuração inválida — faltando apiKey ou projectId');
        setBusy(false);
        return;
      }
      await onConfigure(parsed);
    } catch (e) {
      onShowToast('error', 'JSON inválido: ' + e.message);
    }
    setBusy(false);
  };

  const handleDisconnect = () => {
    onConfirm(
      'Desconectar do Firebase',
      'Os dados em nuvem serão preservados, mas o app voltará a usar somente armazenamento local. Você pode reconectar a qualquer momento.',
      () => onDisconnect()
    );
  };

  return (
    <div>
      <h2 className="panel-title">Sincronização <span className="panel-title__accent">em nuvem</span></h2>
      <p className="panel-sub">Hospede gratuitamente no Firebase para usar de qualquer dispositivo (celular, tablet, PC).</p>

      <div className={`sync-status sync-status--${syncStatus === 'ok' ? 'ok' : syncStatus === 'err' ? 'err' : 'off'}`}>
        <span className="sync-pill__dot"></span>
        <div>
          <div className="sync-status__title">
            {syncStatus === 'ok' && (usingEmbedded ? '✓ Conectado · Configuração padrão' : '✓ Conectado ao Firebase')}
            {syncStatus === 'err' && '⚠ Erro de conexão'}
            {syncStatus === 'off' && 'Modo local (sem nuvem)'}
          </div>
          <div className="sync-status__sub">
            {syncStatus === 'ok' && usingEmbedded && 'Este aplicativo já vem pré-configurado. Qualquer dispositivo que abrir o link sincroniza automaticamente.'}
            {syncStatus === 'ok' && !usingEmbedded && 'Os dados estão sincronizados em tempo real entre todos os dispositivos.'}
            {syncStatus === 'err' && (syncError || 'Verifique a configuração e as regras do Firestore.')}
            {syncStatus === 'off' && 'Os dados ficam salvos apenas neste navegador.'}
          </div>
        </div>
      </div>

      {usingEmbedded && syncStatus === 'ok' && (
        <div className="help-box">
          <strong>Configuração padrão ativa.</strong> Este app já está conectado ao Firebase da Farmácia Luz. <strong>Você não precisa fazer nada.</strong> Os dados sincronizam automaticamente entre todos os dispositivos que abrirem este link.
          <br/><br/>
          Esta seção abaixo permite trocar para uma configuração personalizada — útil apenas se você quiser usar um Firebase diferente.
        </div>
      )}

      <div className="help-box">
        <strong>Como configurar o Firebase (gratuito) — passo a passo:</strong>
        <ol>
          <li>Acesse <code>https://console.firebase.google.com</code> e faça login com sua conta Google.</li>
          <li>Clique em <strong>"Adicionar projeto"</strong> → dê um nome (ex.: <em>farmacia-luz-ponto</em>) → confirme.</li>
          <li>No painel do projeto, vá em <strong>"Build" → "Firestore Database"</strong> → <strong>"Criar banco de dados"</strong> → escolha região <em>southamerica-east1</em> → <strong>"Iniciar em modo de teste"</strong>.</li>
          <li>Volte à página inicial do projeto → clique no ícone <strong>{'</>'}</strong> (Web) para registrar um app web → dê um apelido → <strong>"Registrar app"</strong>.</li>
          <li>O Firebase mostra um trecho de código com um objeto <code>firebaseConfig = {'{...}'}</code>. <strong>Copie SÓ o conteúdo desse objeto</strong> (a parte entre chaves).</li>
          <li>Cole abaixo, no campo de configuração, e clique em <strong>Conectar</strong>.</li>
        </ol>
      </div>

      <section className="card panel" style={{marginBottom: '1.5rem'}}>
        <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>
          Configuração do Firebase
        </h3>
        <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.875rem'}}>
          Cole aqui o JSON de configuração obtido no console do Firebase.
        </p>
        <textarea
          className="field__textarea"
          value={configJson}
          onChange={(e) => setConfigJson(e.target.value)}
          placeholder={`{
  "apiKey": "AIza...",
  "authDomain": "seu-projeto.firebaseapp.com",
  "projectId": "seu-projeto",
  "storageBucket": "seu-projeto.appspot.com",
  "messagingSenderId": "123456789",
  "appId": "1:123:web:abc"
}`}
        />
        <div style={{display:'flex',gap:'0.5rem',marginTop:'1rem',flexWrap:'wrap'}}>
          <button className="btn-primary" onClick={handleSave} disabled={busy || !configJson.trim()} style={{width:'auto',padding:'0.875rem 1.5rem'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:'0.5rem'}}>
              <Icon.Cloud /> {busy ? 'Conectando...' : 'Conectar'}
            </span>
          </button>
          {syncStatus === 'ok' && (
            <button className="btn-ghost btn-ghost--danger" onClick={handleDisconnect}>Desconectar</button>
          )}
        </div>
      </section>

      <div className="help-box">
        <strong>Importante sobre as regras de segurança:</strong> o "modo de teste" do Firestore permite leitura/escrita por 30 dias.
        <br/>Para uso prolongado, no console do Firebase em <em>Firestore Database → Regras</em>, cole isto e publique:
        <pre style={{margin: '0.75rem 0 0',padding:'0.75rem',background:'var(--white)',border:'1px solid var(--line)',borderRadius:'6px',fontSize:'0.75rem',overflow:'auto'}}>{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /${FIRESTORE_COLLECTION}/{doc} {
      allow read, write: if true;
    }
  }
}`}</pre>
        <p style={{margin:'0.5rem 0 0',fontSize:'0.8125rem'}}>
          ⚠️ Isso libera acesso público à coleção. As senhas dos colaboradores são armazenadas com hash SHA-256, e a coleção tem nome ofuscado, mas <strong>para máxima segurança você deve ativar Authentication</strong> no Firebase posteriormente.
        </p>
      </div>
    </div>
  );
}
