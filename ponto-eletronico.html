function AdminBackup({ data, onUpdateData, onShowToast, onConfirm }) {
  const fileInputRef = useRef(null);

  const handleExport = () => {
    const json = JSON.stringify(data, null, 2);
    downloadBlob(json, `backup_ponto_${todayKey()}.json`, 'application/json');
    onShowToast('success', 'Backup baixado');
  };

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported || typeof imported !== 'object') throw new Error('inválido');
        onConfirm('Restaurar backup', 'Isso substitui TODOS os dados atuais. Continuar?',
          () => {
            onUpdateData(imported, true);
            onShowToast('success', 'Backup restaurado');
          });
      } catch (err) { onShowToast('error', 'Arquivo inválido'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const handleClearRecords = () => {
    onConfirm('Apagar registros', 'Apaga TODOS os pontos batidos mas mantém colaboradores. Faça backup antes!',
      () => { onUpdateData({ records: [] }); onShowToast('info', 'Registros apagados'); });
  };

  const handleResetAll = () => {
    onConfirm('Resetar aplicativo', 'Apaga TUDO e volta à tela inicial. Não pode ser desfeito.',
      () => {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(FIREBASE_CONFIG_KEY);
        location.reload();
      });
  };

  return (
    <div>
      <h2 className="panel-title">Backup <span className="panel-title__accent">& dados</span></h2>
      <p className="panel-sub">Mesmo usando Firebase, faça backups locais periódicos.</p>

      <div className="help-box">
        <strong>Recomendação:</strong> Faça backup pelo menos uma vez por mês (antes do fechamento). Guarde em local seguro.
      </div>

      <section className="card panel" style={{marginBottom:'1.5rem'}}>
        <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>Exportar backup completo</h3>
        <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.9375rem'}}>Arquivo JSON com colaboradores, registros e configurações.</p>
        <button className="btn-secondary" onClick={handleExport}>
          <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Download /> Baixar backup</span>
        </button>
      </section>

      <section className="card panel" style={{marginBottom:'1.5rem'}}>
        <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>Restaurar de backup</h3>
        <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.9375rem'}}>Substitui todos os dados pelo conteúdo do arquivo.</p>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImport} className="file-input-hidden" />
        <button className="btn-secondary" onClick={() => fileInputRef.current?.click()}>
          <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Upload /> Selecionar arquivo</span>
        </button>
      </section>

      <div className="section-divider">
        <div className="section-divider__line"></div>
        <div className="section-divider__label">Zona de perigo</div>
        <div className="section-divider__line"></div>
      </div>

      <section className="card panel" style={{borderColor:'var(--brand-tint-strong)',marginBottom:'1rem'}}>
        <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>Apagar registros</h3>
        <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.9375rem'}}>Útil no início de um novo período. Mantém colaboradores.</p>
        <button className="btn-ghost btn-ghost--danger" onClick={handleClearRecords}>
          <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Trash /> Apagar todos os registros</span>
        </button>
      </section>

      <section className="card panel" style={{borderColor:'var(--brand-tint-strong)'}}>
        <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500}}>Resetar aplicativo</h3>
        <p style={{margin:'0 0 1rem',color:'var(--muted)',fontSize:'0.9375rem'}}>Apaga TUDO localmente (não apaga o Firebase). Volta ao setup.</p>
        <button className="btn-ghost btn-ghost--danger" onClick={handleResetAll}>
          <span style={{display:'inline-flex',alignItems:'center',gap:'0.375rem'}}><Icon.Trash /> Resetar tudo</span>
        </button>
      </section>
    </div>
  );
}

/* ============================================================
   ADMIN — Modal de Edição/Adição Manual de Registro
   ============================================================ */
function EditRecordModal({ record, employees, onSave, onDelete, onCancel }) {
  const isNew = !record.id;
  const initialDate = record.timestamp ? new Date(record.timestamp) : new Date();
  const [employeeId, setEmployeeId] = useState(record.employeeId || (employees[0]?.id || ''));
  const [type, setType] = useState(record.type || 'entrada');
  const [dateStr, setDateStr] = useState(
    `${initialDate.getFullYear()}-${pad(initialDate.getMonth()+1)}-${pad(initialDate.getDate())}`
  );
  const [timeStr, setTimeStr] = useState(`${pad(initialDate.getHours())}:${pad(initialDate.getMinutes())}`);
  const [reason, setReason] = useState('');
  const [error, setError] = useState('');

  const handleSave = () => {
    setError('');
    if (!employeeId) return setError('Selecione um colaborador');
    if (!reason.trim()) return setError('Informe o motivo do ajuste');
    const [hh, mm] = timeStr.split(':');
    const [y, m, d] = dateStr.split('-').map(Number);
    if (!y || !m || !d || hh == null || mm == null) return setError('Data ou hora inválida');
    const dt = new Date(y, m-1, d, parseInt(hh), parseInt(mm), 0);
    const employee = employees.find(e => e.id === employeeId);
    const updated = {
      id: record.id || uuid(),
      employeeId,
      employeeName: employee?.name || record.employeeName || '?',
      type,
      timestamp: dt.getTime(),
      dateKey: todayKey(dt),
      dateStr: formatDate(dt),
      timeStr: formatTime(dt),
      location: record.location || null,
      distance: record.distance ?? null,
      withinFence: record.withinFence ?? null,
      edited: true,
      editedAt: Date.now(),
      editReason: reason.trim(),
    };
    onSave(updated);
  };

  const handleDelete = () => {
    if (!confirm(`Excluir este registro de ${formatDate(new Date(record.timestamp))} às ${record.timeStr}? Esta ação não pode ser desfeita.`)) return;
    onDelete(record.id);
  };

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '32rem'}}>
        <h3 className="modal__title">{isNew ? 'Adicionar registro' : 'Editar registro'}</h3>
        <p className="modal__msg">
          {isNew ? 'Cadastrar um ponto manualmente (ex: colaborador esqueceu de bater).' : 'Ajustar dados deste registro.'}
        </p>

        <div className="field">
          <label className="field__label">Colaborador</label>
          <select className="field__select" value={employeeId} onChange={(e) => setEmployeeId(e.target.value)} disabled={!isNew}>
            <option value="">Selecione...</option>
            {employees.map(emp => (<option key={emp.id} value={emp.id}>{emp.name}</option>))}
          </select>
        </div>

        <div className="form-row" style={{marginBottom:'1rem'}}>
          <div>
            <label className="field__label">Tipo</label>
            <select className="field__select" value={type} onChange={(e) => setType(e.target.value)}>
              <option value="entrada">Entrada</option>
              <option value="inicio_intervalo">Saída p/ Almoço</option>
              <option value="fim_intervalo">Volta do Almoço</option>
              <option value="saida">Saída</option>
            </select>
          </div>
          <div>
            <label className="field__label">Data</label>
            <input className="field__input" type="date" value={dateStr} onChange={(e) => setDateStr(e.target.value)} />
          </div>
          <div>
            <label className="field__label">Hora</label>
            <input className="field__input" type="time" value={timeStr} onChange={(e) => setTimeStr(e.target.value)} />
          </div>
        </div>

        <div className="field">
          <label className="field__label">Motivo do ajuste *</label>
          <input className="field__input" type="text" value={reason} onChange={(e) => setReason(e.target.value)}
            placeholder="Ex: colaborador esqueceu de bater a saída" />
        </div>

        {error && <div className="field__error" style={{marginBottom:'1rem'}}>{error}</div>}

        <div className="modal__actions" style={{justifyContent: 'space-between'}}>
          <div>
            {!isNew && (
              <button className="btn-ghost btn-ghost--danger" onClick={handleDelete}>Excluir</button>
            )}
          </div>
          <div style={{display:'flex',gap:'0.5rem'}}>
            <button className="btn-secondary" onClick={onCancel}>Cancelar</button>
            <button className="btn-primary" style={{width:'auto'}} onClick={handleSave}>
              {isNew ? 'Adicionar' : 'Salvar'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN — Ajustes manuais de ponto
   ============================================================ */
function AdminAdjustments({ data, onUpdateRecord, onAddRecord, onDeleteRecord, onShowToast }) {
  const now = new Date();
  const [selectedEmployeeId, setSelectedEmployeeId] = useState(data.employees[0]?.id || '');
  const [selectedYear, setSelectedYear] = useState(now.getFullYear());
  const [selectedMonth, setSelectedMonth] = useState(now.getMonth());
  const [editingRecord, setEditingRecord] = useState(null);

  const availableYears = useMemo(() => {
    const years = new Set([now.getFullYear()]);
    data.records.forEach(r => years.add(new Date(r.timestamp).getFullYear()));
    return [...years].sort((a, b) => b - a);
  }, [data.records]);

  const filteredRecords = useMemo(() => {
    if (!selectedEmployeeId) return [];
    const ym = monthKey(selectedYear, selectedMonth);
    return data.records
      .filter(r => r.employeeId === selectedEmployeeId && r.dateKey.startsWith(ym))
      .sort((a, b) => b.timestamp - a.timestamp);
  }, [data.records, selectedEmployeeId, selectedYear, selectedMonth]);

  const handleSave = (record) => {
    if (filteredRecords.some(r => r.id === record.id)) {
      onUpdateRecord(record);
      onShowToast('success', 'Registro atualizado');
    } else {
      onAddRecord(record);
      onShowToast('success', 'Registro adicionado');
    }
    setEditingRecord(null);
  };

  const handleDelete = (recordId) => {
    onDeleteRecord(recordId);
    onShowToast('info', 'Registro excluído');
    setEditingRecord(null);
  };

  const startNew = () => {
    if (!selectedEmployeeId) {
      onShowToast('error', 'Selecione um colaborador primeiro');
      return;
    }
    setEditingRecord({
      employeeId: selectedEmployeeId,
      type: 'entrada',
      timestamp: Date.now(),
    });
  };

  return (
    <div>
      <h2 className="panel-title">Ajustes <span className="panel-title__accent">de ponto</span></h2>
      <p className="panel-sub">
        Corrija pontos esquecidos ou registros incorretos. Todo ajuste fica marcado com motivo e data da alteração.
      </p>

      <div className="help-box">
        <strong>Quando usar:</strong>
        <ul>
          <li>Colaborador esqueceu de bater entrada ou saída</li>
          <li>Bateu o ponto errado (entrada em vez de saída, ou vice-versa)</li>
          <li>Hora ficou registrada errada por algum motivo</li>
        </ul>
        Cada alteração fica registrada com o motivo, e aparece destacada no PDF para fins de auditoria.
      </div>

      <section className="card panel" style={{marginBottom: '1.5rem'}}>
        <div className="form-row" style={{marginBottom: 0}}>
          <div>
            <label className="field__label">Colaborador</label>
            <select className="field__select" value={selectedEmployeeId} onChange={(e) => setSelectedEmployeeId(e.target.value)}>
              <option value="">Selecione...</option>
              {data.employees.map(emp => (<option key={emp.id} value={emp.id}>{emp.name} {!emp.active && '(desativado)'}</option>))}
            </select>
          </div>
          <div>
            <label className="field__label">Mês</label>
            <select className="field__select" value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))}>
              {MESES_NOMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
            </select>
          </div>
          <div>
            <label className="field__label">Ano</label>
            <select className="field__select" value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))}>
              {availableYears.map(y => (<option key={y} value={y}>{y}</option>))}
            </select>
          </div>
        </div>
      </section>

      <div className="toolbar">
        <div>
          <strong>{filteredRecords.length}</strong> {filteredRecords.length === 1 ? 'registro' : 'registros'} no período
        </div>
        <div className="toolbar__right">
          <button className="btn-primary" onClick={startNew} disabled={!selectedEmployeeId} style={{width:'auto', padding: '0.75rem 1.25rem'}}>
            <span style={{display:'inline-flex',alignItems:'center',gap:'0.5rem'}}>
              <Icon.Plus /> Adicionar registro
            </span>
          </button>
        </div>
      </div>

      <section className="card history" style={{marginTop:0}}>
        {filteredRecords.length === 0 ? (
          <div className="empty">
            <div className="empty__title">Nenhum registro nesse período</div>
            <p className="empty__hint">Selecione outro mês ou adicione manualmente</p>
          </div>
        ) : (
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr><th>Tipo</th><th>Data</th><th>Hora</th><th>Local</th><th>Origem</th><th style={{textAlign:'right'}}>Ações</th></tr>
              </thead>
              <tbody>
                {filteredRecords.map(r => {
                  const ti = RECORD_TYPES[r.type] || { label: r.type };
                  const pillClass = r.type === 'inicio_intervalo' || r.type === 'fim_intervalo' ? 'pill--intervalo'
                                  : r.type === 'entrada' ? 'pill--entrada' : 'pill--saida';
                  return (
                  <tr key={r.id}>
                    <td><span className={`pill ${pillClass}`}><span className="pill__dot"></span>{ti.label}</span></td>
                    <td className="cell-date">{r.dateStr}</td>
                    <td className="cell-time">{r.timeStr}</td>
                    <td className="cell-mono" style={{fontSize:'0.8125rem', color: r.withinFence === false ? 'var(--brand)' : 'var(--muted)'}}>
                      {r.distance != null ? (
                        <>{r.distance}m {r.withinFence === false && '⚠'}</>
                      ) : r.edited ? <span style={{color:'var(--muted-softer)'}}>manual</span> : <span style={{color:'var(--muted-softer)'}}>—</span>}
                    </td>
                    <td style={{fontSize:'0.8125rem'}}>
                      {r.edited ? (
                        <span title={r.editReason || ''} style={{color:'var(--amber)'}}>
                          ✎ Ajustado
                          {r.editedAt && <div style={{fontSize:'0.6875rem', color:'var(--muted)', marginTop:'0.125rem'}}>{formatDate(new Date(r.editedAt))}</div>}
                        </span>
                      ) : (
                        <span style={{color:'var(--muted)'}}>Automático</span>
                      )}
                    </td>
                    <td style={{textAlign:'right'}}>
                      <button className="btn-ghost" onClick={() => setEditingRecord(r)}>Editar</button>
                    </td>
                  </tr>
                );})}
              </tbody>
            </table>
          </div>
        )}
      </section>

      {editingRecord && (
        <EditRecordModal
          record={editingRecord}
          employees={data.employees}
          onSave={handleSave}
          onDelete={handleDelete}
          onCancel={() => setEditingRecord(null)}
        />
      )}
    </div>
  );
}

/* ============================================================
   ADMIN — Dashboard do Gestor (tempo real)
   ============================================================ */
function AdminDashboard({ data, onShowToast }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 30000); // atualiza a cada 30s
    return () => clearInterval(id);
  }, []);

  const today = todayKey();
  const activeEmployees = data.employees.filter(e => e.active);

  const liveData = useMemo(() => {
    const presentes = [];
    const almoco = [];
    const ausentes = [];
    const atrasados = [];

    for (const emp of activeEmployees) {
      const todayRecs = data.records.filter(r => r.employeeId === emp.id && r.dateKey === today);
      const status = getCurrentStatus(todayRecs);

      // Verifica atraso (se tem horário fixo)
      let lateMin = 0;
      if (emp.workSchedule?.type === 'fixed' && emp.workSchedule.entrada) {
        const firstEntry = todayRecs.find(r => r.type === 'entrada');
        if (firstEntry) {
          lateMin = getDelayMinutes(firstEntry.timestamp, emp.workSchedule.entrada, today);
        } else {
          // Não chegou ainda — verifica se passou do horário
          const [hh, mm] = emp.workSchedule.entrada.split(':').map(Number);
          const expected = new Date();
          expected.setHours(hh, mm, 0, 0);
          if (Date.now() > expected.getTime() + 5 * 60000) {
            lateMin = Math.round((Date.now() - expected.getTime()) / 60000);
          }
        }
      }

      if (status === 'trabalhando') {
        presentes.push({ emp, lateMin });
        if (lateMin > 5) atrasados.push({ emp, lateMin });
      } else if (status === 'em_intervalo') {
        almoco.push({ emp });
      } else {
        // Fora: pode ser ausente, ou já bateu saída
        const hasAnyRecord = todayRecs.length > 0;
        ausentes.push({ emp, hasAnyRecord, lateMin });
        if (!hasAnyRecord && lateMin > 5) atrasados.push({ emp, lateMin });
      }
    }
    return { presentes, almoco, ausentes, atrasados };
  }, [data.records, data.employees, today, tick]);

  // Pedidos pendentes
  const pendingRequests = (data.adjustmentRequests || []).filter(r => r.status === 'pending').length;
  // Registros com justificativa não revisada
  const pendingJustifications = data.records.filter(r => r.needsApproval && r.approved === null).length;

  return (
    <div>
      <h2 className="panel-title">Dashboard <span className="panel-title__accent">do Gestor</span></h2>
      <p className="panel-sub">
        Visão em tempo real da equipe · Atualiza automaticamente a cada 30s · {new Date().toLocaleTimeString('pt-BR')}
      </p>

      {/* KPIs principais */}
      <div className="stats" style={{marginTop: 0, marginBottom: '1.5rem'}}>
        <div className="stats__cell">
          <div className="stats__label">Presentes agora</div>
          <div className="stats__value" style={{color: 'var(--brand)'}}>{liveData.presentes.length}</div>
        </div>
        <div className="stats__cell">
          <div className="stats__label">No almoço</div>
          <div className="stats__value" style={{color: 'var(--amber)'}}>{liveData.almoco.length}</div>
        </div>
        <div className="stats__cell">
          <div className="stats__label">Ausentes</div>
          <div className="stats__value" style={{color: 'var(--dark)'}}>{liveData.ausentes.length}</div>
        </div>
        <div className="stats__cell">
          <div className="stats__label">Atrasados hoje</div>
          <div className="stats__value" style={{color: 'var(--brand)'}}>{liveData.atrasados.length}</div>
        </div>
      </div>

      {/* Alertas pendentes */}
      {(pendingRequests > 0 || pendingJustifications > 0) && (
        <section className="card panel" style={{marginBottom: '1.5rem', borderColor: 'var(--amber)', backgroundColor: 'var(--amber-tint)'}}>
          <h3 style={{margin:'0 0 0.5rem',fontFamily:'var(--font-display)',fontSize:'1.125rem',fontWeight:500,color:'#8A6A2C'}}>
            ⚠ Pendências de revisão
          </h3>
          <ul style={{margin:0, paddingLeft:'1.25rem', fontSize:'0.875rem'}}>
            {pendingRequests > 0 && (<li><strong>{pendingRequests}</strong> solicitação(ões) de ajuste pendente(s) · vá em "Aprovações"</li>)}
            {pendingJustifications > 0 && (<li><strong>{pendingJustifications}</strong> ponto(s) com justificativa para revisar · vá em "Ajustes"</li>)}
          </ul>
        </section>
      )}

      {/* Listas detalhadas */}
      <div style={{display: 'grid', gridTemplateColumns: '1fr', gap: '1.5rem'}}>
        {liveData.presentes.length > 0 && (
          <section className="card history" style={{marginTop: 0}}>
            <div className="history__head">
              <h3 className="history__title">✅ Trabalhando agora <span className="history__title-accent">({liveData.presentes.length})</span></h3>
            </div>
            <div className="table-wrap">
              <table className="table">
                <thead><tr><th>Nome</th><th>Setor</th><th>Status</th></tr></thead>
                <tbody>
                  {liveData.presentes.map(({emp, lateMin}) => (
                    <tr key={emp.id}>
                      <td className="cell-name">{emp.name}</td>
                      <td style={{fontSize: '0.8125rem'}}>{emp.sector || '—'}</td>
                      <td>
                        {lateMin > 5 ? (
                          <span style={{color: 'var(--brand)', fontSize: '0.8125rem'}}>Chegou {lateMin}min atrasado</span>
                        ) : (
                          <span style={{color: 'var(--muted)', fontSize: '0.8125rem'}}>Em dia</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}

        {liveData.almoco.length > 0 && (
          <section className="card history" style={{marginTop: 0}}>
            <div className="history__head">
              <h3 className="history__title">🍽 No almoço <span className="history__title-accent">({liveData.almoco.length})</span></h3>
            </div>
            <div className="table-wrap">
              <table className="table">
                <thead><tr><th>Nome</th><th>Setor</th></tr></thead>
                <tbody>
                  {liveData.almoco.map(({emp}) => (
                    <tr key={emp.id}>
                      <td className="cell-name">{emp.name}</td>
                      <td style={{fontSize: '0.8125rem'}}>{emp.sector || '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}

        {liveData.ausentes.length > 0 && (
          <section className="card history" style={{marginTop: 0}}>
            <div className="history__head">
              <h3 className="history__title">❌ Não estão trabalhando <span className="history__title-accent">({liveData.ausentes.length})</span></h3>
            </div>
            <div className="table-wrap">
              <table className="table">
                <thead><tr><th>Nome</th><th>Setor</th><th>Status</th></tr></thead>
                <tbody>
                  {liveData.ausentes.map(({emp, hasAnyRecord, lateMin}) => (
                    <tr key={emp.id}>
                      <td className="cell-name">{emp.name}</td>
                      <td style={{fontSize: '0.8125rem'}}>{emp.sector || '—'}</td>
                      <td style={{fontSize: '0.8125rem'}}>
                        {hasAnyRecord ? (
                          <span style={{color: 'var(--muted)'}}>Já saiu hoje</span>
                        ) : lateMin > 5 ? (
                          <span style={{color: 'var(--brand)'}}>Não chegou · {lateMin}min de atraso</span>
                        ) : (
                          <span style={{color: 'var(--muted)'}}>Não chegou ainda</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN — Solicitações de Ajuste (Aprovações)
   ============================================================ */
function AdminApprovals({ data, onUpdateData, onShowToast, onAddRecord }) {
  const requests = (data.adjustmentRequests || []).sort((a, b) => b.requestedAt - a.requestedAt);
  const pendingCount = requests.filter(r => r.status === 'pending').length;
  // Também os registros com justificativa não revisada (geofence fora do raio)
  const pendingJustifications = data.records.filter(r => r.needsApproval && r.approved === null);

  const handleApproveRequest = (req) => {
    if (req.type === 'add_record') {
      // Cria o registro
      const [hh, mm] = req.proposedTime.split(':').map(Number);
      const [y, m, d] = req.dateKey.split('-').map(Number);
      const dt = new Date(y, m-1, d, hh, mm, 0);
      const employee = data.employees.find(e => e.id === req.employeeId);
      const newRecord = {
        id: uuid(),
        employeeId: req.employeeId,
        employeeName: employee?.name || req.employeeName,
        type: req.recordType,
        timestamp: dt.getTime(),
        dateKey: req.dateKey,
        dateStr: formatDate(dt),
        timeStr: formatTime(dt),
        location: null,
        edited: true,
        editedAt: Date.now(),
        editReason: `Aprovado pelo admin: ${req.reason}`,
      };
      onAddRecord(newRecord);
    }
    // Atualiza request
    onUpdateData({
      adjustmentRequests: requests.map(r =>
        r.id === req.id ? { ...r, status: 'approved', reviewedAt: Date.now(), reviewedBy: 'admin' } : r
      ),
    });
    onShowToast('success', 'Solicitação aprovada');
  };

  const handleRejectRequest = (req) => {
    const note = prompt('Motivo da rejeição (opcional):') || '';
    onUpdateData({
      adjustmentRequests: requests.map(r =>
        r.id === req.id ? { ...r, status: 'rejected', reviewedAt: Date.now(), reviewedBy: 'admin', reviewNote: note } : r
      ),
    });
    onShowToast('info', 'Solicitação rejeitada');
  };

  const handleApproveJustification = (rec) => {
    onUpdateData({
      records: data.records.map(r => r.id === rec.id ? { ...r, approved: true } : r),
    });
    onShowToast('success', 'Ponto aprovado');
  };

  const handleRejectJustification = (rec) => {
    if (!confirm(`Rejeitar o ponto de ${rec.employeeName} às ${rec.timeStr}? O registro será marcado como inválido mas não apagado.`)) return;
    onUpdateData({
      records: data.records.map(r => r.id === rec.id ? { ...r, approved: false } : r),
    });
    onShowToast('info', 'Ponto rejeitado');
  };

  return (
    <div>
      <h2 className="panel-title">Aprovações <span className="panel-title__accent">{pendingCount + pendingJustifications.length > 0 ? `(${pendingCount + pendingJustifications.length})` : ''}</span></h2>
      <p className="panel-sub">Solicitações de ajuste e pontos batidos fora do local.</p>

      {pendingJustifications.length > 0 && (
        <>
          <h3 style={{margin:'1.5rem 0 0.75rem', fontFamily:'var(--font-display)', fontSize:'1.125rem', fontWeight:500}}>
            Pontos com justificativa ({pendingJustifications.length})
          </h3>
          <section className="card history" style={{marginTop: 0}}>
            <div className="table-wrap">
              <table className="table">
                <thead>
                  <tr><th>Colaborador</th><th>Tipo</th><th>Data/Hora</th><th>Distância</th><th>Justificativa</th><th style={{textAlign:'right'}}>Ação</th></tr>
                </thead>
                <tbody>
                  {pendingJustifications.map(rec => (
                    <tr key={rec.id}>
                      <td className="cell-name">{rec.employeeName}</td>
                      <td>{RECORD_TYPES[rec.type]?.label || rec.type}</td>
                      <td className="cell-mono" style={{fontSize: '0.8125rem'}}>{rec.dateStr} {rec.timeStr}</td>
                      <td style={{color: 'var(--brand)', fontSize: '0.8125rem'}}>{rec.distance}m ⚠</td>
                      <td style={{fontSize: '0.8125rem', maxWidth: '20rem'}}>{rec.justification}</td>
                      <td style={{textAlign: 'right'}}>
                        <div style={{display:'inline-flex',gap:'0.375rem'}}>
                          <button className="btn-ghost btn-ghost--accent" onClick={() => handleApproveJustification(rec)}>Aprovar</button>
                          <button className="btn-ghost btn-ghost--danger" onClick={() => handleRejectJustification(rec)}>Rejeitar</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </>
      )}

      <h3 style={{margin:'1.5rem 0 0.75rem', fontFamily:'var(--font-display)', fontSize:'1.125rem', fontWeight:500}}>
        Solicitações de ajuste ({requests.length})
      </h3>
      {requests.length === 0 ? (
        <div className="card panel">
          <div className="empty">
            <div className="empty__title">Nenhuma solicitação ainda</div>
            <p className="empty__hint">Colaboradores podem solicitar ajustes pelo próprio app</p>
          </div>
        </div>
      ) : (
        <section className="card history" style={{marginTop:0}}>
          <div className="table-wrap">
            <table className="table">
              <thead>
                <tr><th>Colaborador</th><th>Pedido</th><th>Motivo</th><th>Status</th><th style={{textAlign:'right'}}>Ações</th></tr>
              </thead>
              <tbody>
                {requests.map(req => {
                  const emp = data.employees.find(e => e.id === req.employeeId);
                  return (
                    <tr key={req.id}>
                      <td className="cell-name">{emp?.name || req.employeeName}</td>
                      <td style={{fontSize: '0.8125rem'}}>
                        <div>{RECORD_TYPES[req.recordType]?.label || req.recordType}</div>
                        <div className="cell-mono" style={{color: 'var(--muted)'}}>{req.dateKey} às {req.proposedTime}</div>
                      </td>
                      <td style={{fontSize: '0.8125rem', maxWidth: '16rem'}}>{req.reason}</td>
                      <td>
                        <span className={`pill ${req.status === 'pending' ? 'pill--intervalo' : req.status === 'approved' ? 'pill--entrada' : 'pill--saida'}`}>
                          <span className="pill__dot"></span>
                          {req.status === 'pending' ? 'pendente' : req.status === 'approved' ? 'aprovado' : 'rejeitado'}
                        </span>
                      </td>
                      <td style={{textAlign: 'right'}}>
                        {req.status === 'pending' ? (
                          <div style={{display:'inline-flex',gap:'0.375rem'}}>
                            <button className="btn-ghost btn-ghost--accent" onClick={() => handleApproveRequest(req)}>Aprovar</button>
                            <button className="btn-ghost btn-ghost--danger" onClick={() => handleRejectRequest(req)}>Rejeitar</button>
                          </div>
                        ) : (
                          <span style={{fontSize: '0.75rem', color: 'var(--muted)'}}>
                            {req.reviewedAt && formatDate(new Date(req.reviewedAt))}
                          </span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </section>
      )}
    </div>
  );
}

/* ============================================================
   EMPLOYEE — Modal para solicitar ajuste
   ============================================================ */
function RequestAdjustmentModal({ currentUser, onSubmit, onCancel }) {
  const [recordType, setRecordType] = useState('entrada');
  const [dateKey, setDateKey] = useState(todayKey());
  const [proposedTime, setProposedTime] = useState('08:00');
  const [reason, setReason] = useState('');
  const [error, setError] = useState('');

  const handleSubmit = () => {
    setError('');
    if (!reason.trim()) return setError('Informe o motivo');
    if (reason.trim().length < 10) return setError('Motivo muito curto (mínimo 10 caracteres)');
    const req = {
      id: uuid(),
      employeeId: currentUser.id,
      employeeName: currentUser.name,
      type: 'add_record',
      recordType,
      dateKey,
      proposedTime,
      reason: reason.trim(),
      requestedAt: Date.now(),
      status: 'pending',
    };
    onSubmit(req);
  };

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '32rem'}}>
        <h3 className="modal__title">Solicitar ajuste de ponto</h3>
        <p className="modal__msg">
          Esqueceu de bater um ponto ou houve algum problema? Envie uma solicitação para o gestor revisar.
        </p>

        <div className="form-row" style={{marginBottom: '1rem'}}>
          <div>
            <label className="field__label">Tipo</label>
            <select className="field__select" value={recordType} onChange={(e) => setRecordType(e.target.value)}>
              <option value="entrada">Entrada</option>
              <option value="inicio_intervalo">Saída p/ Almoço</option>
              <option value="fim_intervalo">Volta do Almoço</option>
              <option value="saida">Saída</option>
            </select>
          </div>
          <div>
            <label className="field__label">Data</label>
            <input className="field__input" type="date" value={dateKey} onChange={(e) => setDateKey(e.target.value)} max={todayKey()} />
          </div>
          <div>
            <label className="field__label">Hora</label>
            <input className="field__input" type="time" value={proposedTime} onChange={(e) => setProposedTime(e.target.value)} />
          </div>
        </div>

        <div className="field">
          <label className="field__label">Motivo *</label>
          <textarea className="field__textarea" value={reason} onChange={(e) => setReason(e.target.value)}
            placeholder="Ex: Esqueci de bater a saída ontem porque o sistema travou..."
            style={{minHeight: '5rem'}} />
        </div>

        {error && <div className="field__error" style={{marginBottom: '1rem'}}>{error}</div>}

        <div className="modal__actions">
          <button className="btn-secondary" onClick={onCancel}>Cancelar</button>
          <button className="btn-primary" style={{width:'auto'}} onClick={handleSubmit}>Enviar solicitação</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN SCREEN
   ============================================================ */
function AdminScreen({ data, onUpdateData, onShowToast, onConfirm, syncStatus, syncError, onConfigureSync, onDisconnectSync, onUpdateRecord, onAddRecord, onDeleteRecord }) {
  const [tab, setTab] = useState('dashboard');
  const pendingCount = (data.adjustmentRequests || []).filter(r => r.status === 'pending').length +
    data.records.filter(r => r.needsApproval && r.approved === null).length;
  return (
    <div>
      <div className="tabs">
        <button className={`tab ${tab === 'dashboard' ? 'is-active' : ''}`} onClick={() => setTab('dashboard')}>📊 Painel</button>
        <button className={`tab ${tab === 'approvals' ? 'is-active' : ''}`} onClick={() => setTab('approvals')}>
          Aprovações {pendingCount > 0 && <span style={{display:'inline-block',marginLeft:'0.375rem',padding:'0.125rem 0.375rem',backgroundColor:'var(--brand)',color:'white',borderRadius:'9999px',fontSize:'0.625rem'}}>{pendingCount}</span>}
        </button>
        <button className={`tab ${tab === 'employees' ? 'is-active' : ''}`} onClick={() => setTab('employees')}>Colaboradores</button>
        <button className={`tab ${tab === 'reports' ? 'is-active' : ''}`} onClick={() => setTab('reports')}>Relatórios</button>
        <button className={`tab ${tab === 'adjust' ? 'is-active' : ''}`} onClick={() => setTab('adjust')}>Ajustes</button>
        <button className={`tab ${tab === 'sync' ? 'is-active' : ''}`} onClick={() => setTab('sync')}>Sincronização</button>
        <button className={`tab ${tab === 'settings' ? 'is-active' : ''}`} onClick={() => setTab('settings')}>Configurações</button>
        <button className={`tab ${tab === 'backup' ? 'is-active' : ''}`} onClick={() => setTab('backup')}>Backup</button>
      </div>
      {tab === 'dashboard' && <AdminDashboard data={data} onShowToast={onShowToast} />}
      {tab === 'approvals' && <AdminApprovals data={data} onUpdateData={onUpdateData} onShowToast={onShowToast} onAddRecord={onAddRecord} />}
      {tab === 'employees' && <AdminEmployees data={data} onUpdateData={onUpdateData} onShowToast={onShowToast} onConfirm={onConfirm} />}
      {tab === 'reports' && <AdminReports data={data} onShowToast={onShowToast} />}
      {tab === 'adjust' && <AdminAdjustments data={data} onUpdateRecord={onUpdateRecord} onAddRecord={onAddRecord} onDeleteRecord={onDeleteRecord} onShowToast={onShowToast} />}
      {tab === 'sync' && <AdminSync syncStatus={syncStatus} syncError={syncError} onConfigure={onConfigureSync} onDisconnect={onDisconnectSync} onShowToast={onShowToast} onConfirm={onConfirm} />}
      {tab === 'settings' && <AdminSettings data={data} onUpdateData={onUpdateData} onShowToast={onShowToast} />}
      {tab === 'backup' && <AdminBackup data={data} onUpdateData={onUpdateData} onShowToast={onShowToast} onConfirm={onConfirm} />}
    </div>
  );
}

/* ============================================================
   TOAST + MODAL
   ============================================================ */
function Toast({ message, type, onClose }) {
  useEffect(() => { const id = setTimeout(onClose, 3000); return () => clearTimeout(id); }, [onClose]);
  return (
    <div className="toast">
      <div className={`toast__box toast__box--${type}`}>
        <div className="toast__icon">{type === 'success' ? '✓' : type === 'error' ? '!' : 'i'}</div>
        <div className="toast__msg">{message}</div>
      </div>
    </div>
  );
}
function ConfirmModal({ title, message, onConfirm, onCancel }) {
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3 className="modal__title">{title}</h3>
        <p className="modal__msg">{message}</p>
        <div className="modal__actions">
          <button className="btn-secondary" onClick={onCancel}>Cancelar</button>
          <button className="btn-primary" style={{width:'auto'}}
            onClick={() => { onConfirm(); onCancel(); }}>Confirmar</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP PRINCIPAL
   ============================================================ */
function App() {
  const initialData = loadData();
  const [data, setData] = useState(initialData);
  const [currentUser, setCurrentUser] = useState(null);
  const [toast, setToast] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [syncStatus, setSyncStatus] = useState('off'); // 'ok'|'off'|'err'
  const [syncError, setSyncError] = useState('');
  // Se há config embutida E não há setup local, espera o Firebase responder
  const [initLoading, setInitLoading] = useState(
    !!EMBEDDED_FIREBASE_CONFIG && !initialData.setup
  );
  const isRemoteUpdateRef = useRef(false);
  const firebaseReadyRef = useRef(!!window.firebaseSDK);

  /* Toasts e confirms */
  const showToast = useCallback((type, message) => { setToast({ type, message, id: Date.now() }); }, []);
  const showConfirm = useCallback((title, message, onConfirm) => { setConfirm({ title, message, onConfirm }); }, []);

  /* Inicializa Firebase quando SDK estiver pronto */
  useEffect(() => {
    const tryInit = async () => {
      if (!window.firebaseSDK) return;
      firebaseReadyRef.current = true;
      if (firebaseSync.isConfigured()) {
        firebaseSync.onError = (msg) => { setSyncStatus('err'); setSyncError(msg); setInitLoading(false); };
        firebaseSync.onConnected = () => { setSyncError(''); };
        const ok = await firebaseSync.init();
        if (ok) {
          // Primeiro, busca dados remotos uma vez
          try {
            const remote = await firebaseSync.fetchOnce();
            if (remote && remote.payload) {
              isRemoteUpdateRef.current = true;
              setData(remote.payload);
            } else if (initialData.setup) {
              // Envia dados locais se Firebase ainda não tinha nada
              await firebaseSync.save(initialData);
            }
          } catch (e) {/* silent */}
          // Depois subscreve para mudanças em tempo real
          firebaseSync.subscribe((remoteData) => {
            isRemoteUpdateRef.current = true;
            setData(remoteData);
          });
          setSyncStatus('ok');
        }
      }
      setInitLoading(false);
    };
    if (window.firebaseSDK) tryInit();
    else window.addEventListener('firebase-ready', tryInit, { once: true });
    // Timeout de segurança: se o Firebase demorar mais de 8s, tira o loading
    const safetyTimeout = setTimeout(() => setInitLoading(false), 8000);
    return () => {
      window.removeEventListener('firebase-ready', tryInit);
      clearTimeout(safetyTimeout);
    };
  }, []);

  /* Persiste local + envia para Firebase em mudanças locais */
  useEffect(() => {
    saveData(data);
    if (isRemoteUpdateRef.current) {
      isRemoteUpdateRef.current = false;
      return;
    }
    if (syncStatus === 'ok') {
      firebaseSync.save(data).catch((e) => {
        console.error('Save sync error:', e);
        setSyncStatus('err'); setSyncError(e.message || 'Erro ao salvar na nuvem');
      });
    }
  }, [data, syncStatus]);

  /* Updates */
  const updateData = useCallback((patch, replace = false) => {
    setData(prev => replace ? { ...DEFAULT_DATA, ...patch } : { ...prev, ...patch });
  }, []);

  const handleSetupComplete = async ({ companyName, passwordHash }) => {
    setData(prev => ({
      ...prev, setup: true,
      admin: { passwordHash },
      settings: { ...prev.settings, companyName },
    }));
    showToast('success', 'Pronto! Faça login como administrador.');
  };
  const handleLoginEmployee = (emp) => setCurrentUser({ type: 'employee', id: emp.id, name: emp.name });
  const handleLoginAdmin = () => setCurrentUser({ type: 'admin', id: 'admin', name: 'Administrador' });
  const handleLogout = () => setCurrentUser(null);
  const handleAddRecord = (record) => setData(prev => ({ ...prev, records: [...prev.records, record] }));
  const handleUpdateRecord = (record) => setData(prev => ({
    ...prev,
    records: prev.records.map(r => r.id === record.id ? record : r),
  }));
  const handleDeleteRecord = (recordId) => setData(prev => ({
    ...prev,
    records: prev.records.filter(r => r.id !== recordId),
  }));
  const handleAddAdjustmentRequest = (req) => setData(prev => ({
    ...prev,
    adjustmentRequests: [...(prev.adjustmentRequests || []), req],
  }));

  /* Sync controls */
  const handleConfigureSync = async (config) => {
    firebaseSync.saveConfig(config);
    firebaseSync.disconnect();
    firebaseSync.onError = (msg) => { setSyncStatus('err'); setSyncError(msg); };
    firebaseSync.onConnected = () => { setSyncError(''); };
    const ok = await firebaseSync.init();
    if (ok) {
      try {
        // Verifica se já existe documento remoto
        const remote = await firebaseSync.fetchOnce();
        if (remote && remote.payload) {
          showConfirm(
            'Dados encontrados na nuvem',
            'Já existem dados sincronizados anteriormente. Deseja USAR os dados da nuvem (sobrescreve o local) ou ENVIAR seus dados atuais (sobrescreve a nuvem)?',
            async () => {
              // Default: usar dados da nuvem
              isRemoteUpdateRef.current = true;
              setData(remote.payload);
              firebaseSync.subscribe((rd) => { isRemoteUpdateRef.current = true; setData(rd); });
              setSyncStatus('ok');
              showToast('success', 'Conectado · usando dados da nuvem');
            }
          );
          // Permite "Cancelar" → enviar local
          // (a UX poderia ser melhor mas resolve)
          // Vamos resolver: se o user cancelar o modal, envia o local
          // Mas ConfirmModal não distingue. Simplificando: enviamos o local sempre quando confirma "enviar".
          // Reorganizando: vamos perguntar de forma binária via prompt simples
        } else {
          await firebaseSync.save(data);
          firebaseSync.subscribe((rd) => { isRemoteUpdateRef.current = true; setData(rd); });
          setSyncStatus('ok');
          showToast('success', 'Conectado · dados locais enviados para a nuvem');
        }
      } catch (e) {
        setSyncStatus('err'); setSyncError(e.message);
        showToast('error', 'Erro ao conectar: ' + e.message);
      }
    } else {
      showToast('error', 'Falha ao conectar. Verifique a configuração.');
    }
  };

  const handleDisconnectSync = () => {
    firebaseSync.disconnect();
    firebaseSync.clearConfig();
    setSyncStatus('off'); setSyncError('');
    showToast('info', 'Desconectado · usando modo local');
  };

  /* ROTEAMENTO */
  // Tela de carregamento inicial enquanto baixa dados do Firebase
  if (initLoading) {
    return (
      <div className="center-screen">
        <div className="auth-card" style={{textAlign: 'center'}}>
          <div className="auth-logo" style={{margin: '0 auto 1.5rem'}}>L</div>
          <h1 className="auth-title" style={{fontSize: '1.5rem'}}>Farmácia Luz</h1>
          <p className="auth-sub" style={{marginBottom: '1.5rem'}}>Carregando dados da nuvem...</p>
          <div style={{display: 'flex', justifyContent: 'center'}}>
            <svg className="capturing__spinner" viewBox="0 0 24 24" fill="none" style={{width: '2rem', height: '2rem', color: 'var(--brand)'}}>
              <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2" opacity="0.25"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
            </svg>
          </div>
        </div>
      </div>
    );
  }

  if (!data.setup || !data.admin.passwordHash) {
    return (
      <>
        <SetupScreen onComplete={handleSetupComplete} logo={data.settings.logo} />
        {toast && <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
      </>
    );
  }

  if (!currentUser) {
    return (
      <>
        <LoginScreen data={data} onLoginEmployee={handleLoginEmployee} onLoginAdmin={handleLoginAdmin} syncStatus={syncStatus} />
        {toast && <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
      </>
    );
  }

  return (
    <div className="app-shell">
      <AppHeader data={data} currentUser={currentUser} onLogout={handleLogout} syncStatus={syncStatus} />
      <main className="app-main">
        {currentUser.type === 'employee' ? (
          <EmployeeScreen data={data} currentUser={currentUser} onAddRecord={handleAddRecord} onAddAdjustmentRequest={handleAddAdjustmentRequest} onShowToast={showToast} />
        ) : (
          <AdminScreen
            data={data} onUpdateData={updateData}
            onShowToast={showToast} onConfirm={showConfirm}
            syncStatus={syncStatus} syncError={syncError}
            onConfigureSync={handleConfigureSync}
            onDisconnectSync={handleDisconnectSync}
            onAddRecord={handleAddRecord}
            onUpdateRecord={handleUpdateRecord}
            onDeleteRecord={handleDeleteRecord}
          />
        )}
      </main>
      <footer className="footer-strip">
        <p>{data.settings.companyName} · {syncStatus === 'ok' ? 'Sincronizado · nuvem' : 'Modo local'}</p>
        <p>v3.0 · CLT 44h · Firebase</p>
      </footer>
      {toast && <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
      {confirm && <ConfirmModal title={confirm.title} message={confirm.message} onConfirm={confirm.onConfirm} onCancel={() => setConfirm(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
